<style>
:root {
  --csif-blue:#005baa;
  --csif-dark:#003b70;
  --bg:#f3f6f9;
  --card:#fff;
  --text:#17212b;
  --muted:#65727e;
  --ok:#198754;
  --bad:#dc3545;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
.container{max-width:900px;margin:auto;padding:18px}
header{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #00000012;display:flex;align-items:center;gap:18px}
header img{width:145px;height:auto;max-height:70px;object-fit:contain}
h1{font-size:22px;margin:0 0 4px;color:var(--csif-dark)}
.subtitle{color:var(--muted);font-size:14px}
.progress-wrap{background:white;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0000000d}
.progress-top{display:flex;justify-content:space-between;font-weight:bold;font-size:14px}
.progress{height:9px;background:#e7edf3;border-radius:10px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--csif-blue);width:0%;transition:.25s}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 2px 10px #00000012}
.badge{display:inline-block;background:#e9f2fb;color:var(--csif-dark);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:bold;margin-bottom:12px}
.question{font-size:20px;font-weight:700;margin:4px 0 20px}
.option{display:block;border:2px solid #e2e8ee;border-radius:12px;padding:13px 14px;margin:10px 0;cursor:pointer;transition:.15s;background:#fff}
.option:hover{border-color:#9abbd8;background:#f8fbfe}
.option input{margin-right:10px;transform:scale(1.15)}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px}
.primary{background:var(--csif-blue);color:white}
.secondary{background:#e9eef3;color:#24313d}
.primary:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
#result{text-align:center}
.score{font-size:46px;font-weight:800;color:var(--csif-blue);margin:8px 0}
.result-detail{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}
.stat{background:#f4f7fa;border-radius:12px;padding:12px 18px;min-width:110px}
.stat strong{display:block;font-size:22px}
.review{text-align:left;margin-top:22px}
.review-item{border:1px solid #e1e7ed;border-radius:12px;padding:15px;margin:12px 0;background:#fff}
.review-item.ok{border-left:6px solid var(--ok)}
.review-item.bad{border-left:6px solid var(--bad)}
.review-q{font-weight:700;margin-bottom:8px}
.answer{font-weight:700}
.explanation{color:#4c5964;font-size:14px;margin-top:8px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(max-width:600px){
  .container{padding:10px}
  header{padding:14px;gap:12px}
  header img{width:105px}
  h1{font-size:18px}
  .question{font-size:18px}
  .card{padding:16px}
  button{flex:1}
}
</style>
</head>

italización que precise reposo domiciliario de un familiar de hasta 2º grado?", "options": ["3 días laborables.", "5 días laborables.", "7 días naturales.", "4 días hábiles."], "correct": "B", "explanation": "El Art. 21.s concede 5 días laborables por accidente o enfermedad graves, hospitalización o intervención quirúrgica sin hospitalización que precise reposo domiciliario de cónyuge, pareja de hecho o parientes hasta el segundo grado."}, {"id": 11, "block": "1. Convenio Colectivo EMAYA Calidad Urbana", "source": "Convenio Colectivo, Art. 21.u", "question": "Según el Art. 21.u, las ausencias por causa de fuerza mayor motivadas por urgencias familiares se retribuirán hasta un límite máximo anual equivalente a:", "options": ["2 días al año.", "4 días al año.", "6 días al año.", "30 horas anuales."], "correct": "B", "explanation": "El Art. 21.u especifica que las personas trabajadoras tendrán derecho a que sean retribuidas las horas de ausencia por fuerza mayor motivos familiares urgentes equivalentes a cuatro días al año."}, {"id": 12, "block": "1. Convenio Colectivo EMAYA Calidad Urbana", "source": "Convenio Colectivo, Art. 21.q", "question": "¿En qué período del año deben disfrutarse los 2 días de permiso retribuido otorgados por fraccionamiento vacacional según el Art. 21.q?", "options": ["En los meses de julio y agosto exclusivamente.", "En el periodo de octubre a marzo, con excepción del 20 de diciembre al 21 de enero.", "Durante todo el año natural sin restricción alguna de fechas.", "Únicamente en el primer trimestre laborable del año."], "correct": "B", "explanation": "El Art. 21.q dispone que los 2 días de permiso por fraccionamiento vacacional se disfrutarán en el periodo de octubre a marzo, a excepción de los días comprendidos entre el 20 de diciembre y el 21 de enero."}, {"id": 13, "block": "1. Convenio Colectivo EMAYA Calidad Urbana", "source": "Convenio Colectivo, Art. 20 / Licencias", "question": "¿Cuál es el límite anual de horas extraordinarias por persona trabajadora fijado en el Convenio Colectivo?", "options": ["50 horas.", "75 horas.", "80 horas.", "100 horas."], "correct": "B", "explanation": "En el texto del Convenio se establece formalmente el número anual de horas extraordinarias en 75 por persona trabajadora, eliminándose totalmente las habituales."}, {"id": 14, "block": "1. Convenio Colectivo EMAYA Calidad Urbana", "source": "Convenio Colectivo, Art. 30.i", "question": "Según el Art. 30.i, las horas trabajadas en franja nocturna tendrán un incremento por nocturnidad sobre el salario base equivalente al:", "options": ["20%.", "25%.", "32%.", "40%."], "correct": "C", "explanation": "El Art. 30.i regula el Plus de nocturnidad para las horas trabajadas entre las 21 y las 6 horas, fijando un incremento del 32% sobre el salario base."}, {"id": 15, "block": "1. Convenio Colectivo EMAYA Calidad Urbana", "source": "Convenio Colectivo, Art. 30.j", "question": "¿A cuánto asciende el Plus de Actividad mensual bruto para el personal a tiempo completo según el Art. 30.j?", "options": ["100,00 euros brutos.", "123,21 euros brutos.", "150,50 euros brutos.", "200,00 euros brutos."], "correct": "B", "explanation": "El Art. 30.j concreta que todo el personal a tiempo completo percibirá en concepto de plus de actividad la cantidad de 123,21 euros brutos."}, {"id": 16, "block": "1. Convenio Colectivo EMAYA Calidad Urbana", "source": "Convenio Colectivo, Art. 30.k", "question": "Según el Art. 30.k, ¿cuál es el importe del Plus de Turnicidad asignado al personal en régimen de turnos rotativos?", "options": ["30,00 euros brutos mensuales en 14 pagas.", "43,10 euros brutos mensuales en 12 pagas.", "55,00 euros brutos mensuales en 12 pagas.", "60,25 euros brutos mensuales en 11 pagas."], "correct": "B", "explanation": "El Art. 30.k establece que el personal adscrito a un sistema de trabajo rotativo percibirá un plus de 43,10 euros brutos mensuales por 12 pagas."}, {"id": 17, "block": "1. Convenio Colectivo EMAYA Calidad Urbana estricto frente a las inspecciones públicas."], "correct": "B", "explanation": "La sección especifica que la conducta debe estar presidida por los principios de lealtad y buena fe con la empresa, con las personas usuarias, la clientela y los proveedores."}, {"id": 23, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Corrupción y Soborno", "question": "¿Qué criterio o postura adopta expresamente EMAYA ante el soborno y la corrupción según su Código Ético?", "options": ["Criterio de análisis caso a caso según la cuantía económica.", "Tolerancia cero frente al soborno y la corrupción.", "Aceptación de pequeños obsequios de cortesía comercial habituales en el sector.", "Derivación exclusiva de responsabilidad al empleado infractor."], "correct": "B", "explanation": "El Código proclama explícitamente que EMAYA adopta un criterio de tolerancia cero frente al soborno y la corrupción en todas sus formas."}, {"id": 24, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Conflictos de Interés", "question": "Ante una situación donde existan intereses personales contrapuestos con los de la empresa, ¿qué exige el Código Ético al personal de EMAYA?", "options": ["Priorizar el interés personal si no causa perjuicio económico directo.", "La comunicación del conflicto de interés y la abstención de intervenir en la toma de decisiones.", "Resolver el asunto internamente sin informar a la Dirección.", "Transferir la decisión a un compañero de la misma categoría."], "correct": "B", "explanation": "EMAYA exige la comunicación de los conflictos de interés y la abstención de intervenir en la toma de decisiones de las personas que directa o indirectamente tengan un interés personal."}, {"id": 25, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Canal Ético", "question": "¿Qué canales o mecanismos ha dispuesto EMAYA para recoger información, dudas o comunicaciones sobre incumplimientos del Código Ético?", "options": ["Un buzón físico no gestionado en la entrada principal.", "Un Canal Ético y una función de compliance que admite comunicaciones incluso anónimas.", "Únicamente denuncia presencial identificada ante la Policía Local.", "Envío de cartas certificadas dirigidas al Consejo de Administración."], "correct": "B", "explanation": "El Código recoge que EMAYA ha dispuesto un canal ético y una función de compliance para recoger, incluso de forma anónima, información, dudas, sugerencias o comunicaciones."}, {"id": 26, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Canal Ético", "question": "Respecto a las personas que hagan uso del Canal Ético actuando de buena fe, ¿cuál es la política de la empresa respecto a posibles represalias?", "options": ["Se toleran si la denuncia no resulta finalmente probada.", "Prohíbe expresamente cualquier tipo de represalia o reacción desfavorable contra el usuario.", "Se aplica una amonestación preventiva por alterar el clima laboral.", "Se exige fianza económica previa para tramitar la comunicación."], "correct": "B", "explanation": "El texto manifiesta rotundamente que EMAYA prohíbe expresamente cualquier tipo de represalia contra los usuarios del canal ético que, actuando de buena fe, hayan comunicado asuntos irregulares."}, {"id": 27, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Confidencialidad", "question": "¿Cómo es considerada la información de carácter no público gestionada por la empresa según el Código Ético?", "options": ["Información de libre difusión previa consulta al superior.", "Considerada reservada y confidencial, aplicando mecanismos de protección físicos y lógicos.", "Accesible para cualquier trabajador de la plantilla sin limitación.", "Pública bajo el principio de transparencia administrativa universal."], "correct": "B", "explanation": "El documento señala que la información no pública es considerada reservada y confidencial, aplicándose los mecanismos físicos y lógicos para preservar su integridad y confidencialidad."}, {"id": 28, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Naturaleza del Código", "question": "Según la sección 'Código Ético', ¿cuál es el carácter u orientación pedagógica del documento frente a los eventuales incumplimientos?", "options": ["Tiene una naturaleza puramente punitiva y sancionadora.", "No tiene finalidad sancionadora; busca prevenir, corregir o reeducar para obtener la mejora continua.", "Es un documento informativo de recomendaciones sin vinculación alguna.", "Sustituye al Código Penal en los delitos cometidos en la empresa."], "correct": "B", "explanation": "El texto indica que el Código no tiene una finalidad sancionadora sino que su función es prevenir conductas contrarias y, en caso de incumplimiento, corregir o reeducar hacia la mejora continua."}, {"id": 29, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Proveedores y Contratistas", "question": "¿Qué exige EMAYA a las empresas proveedoras, contratistas y colaboradoras en relación con el Código Ético?", "options": ["Ningún requisito formal al ser entidades externas independientes.", "Garantizar el mismo estándar de exigencia en principios éticos y requisitos ambientales aplicables.", "Acreditar el pago de tasas municipales adicionales.", "Adscribir a su personal al convenio colectivo de EMAYA."], "correct": "B", "explanation": "El Código explicita que EMAYA garantiza el mismo estándar de exigencia con las empresas proveedoras, contratistas y colaboradoras, exigiendo el cumplimiento de procedimientos ambientales y éticos."}, {"id": 30, "block": "2. Código Ético y de Conducta EMAYA", "source": "Código Ético, Relaciones e Integridad", "question": "En el marco del Código Ético, respecto a obsequios o ventajas ofrecidas por proveedores o terceros, se establece que:", "options": ["Se permiten regalos si no superan un valor estimado de 300 euros.", "Está prohibido aceptar regalos o favores que puedan comprometer la imparcialidad o independencia profesional.", "Cualquier obsequio debe repartirse obligatoriamente entre la plantilla del departamento.", "Son aceptables las comisiones económicas directas si se declaran a Hacienda."], "correct": "B", "explanation": "El Código sanciona que el personal no debe aceptar regalos, favores u obsequios que puedan condicionar la objetividad, imparcialidad o transparencia en el ejercicio de sus funciones."}, {"id": 31, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Requisitos 2", "question": "¿Qué titulación académica se exige como requisito específico de acceso en la convocatoria de Auxiliar Administrativo/a?", "options": ["Título de Graduado Escolar o Certificado de Escolaridad exclusivamente.", "FP de Grado Medio de la familia profesional de Administración y Gestión, o título de nivel superior en administración, finanzas, economía o contabilidad.", "Título de Grado Universitario o Licenciatura en Derecho únicamente.", "Cualquier título de Formación Profesional básica sin importar la rama."], "correct": "B", "explanation": "Las Bases Específicas en su punto 2 exigen estar en posesión de FP grado medio de la familia profesional de Administración y Gestión o un título de nivel superior en administración, finanzas, economía o contabilidad."}, {"id": 32, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Requisitos 3", "question": "¿Cuánta experiencia profesional específica se requiere acreditar en el perfil de la convocatoria según las Bases?", "options": ["6 meses realizando tareas de atención al público.", "1 año realizando tareas administrativas.", "2 años completos en empresas del sector público sanitario.", "No se requiere experiencia previa al ser un proceso de acceso libre."], "correct": "B", "explanation": "El punto 3 de los requisitos establece expresamente la exigencia de contar con una 'Experiencia de 1 año realizando tareas administrativas'."}, {"id": 33, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Requisitos 4", "question": "Según el punto 4 de los requisitos de las Bases, ¿en qué condición de exclusión previa no debe encontrarse el aspirante?", "options": ["No haber sido sancionado por faltas leves en los últimos 5 años.", "No haber sido excluido de otras bolsas de trabajo de Calidad Urbana del perfil de la convocatoria en los últimos 3 años.", "No haber rechazado ofertas de trabajo temporales en cualquier administración balear.", "No haber trabajado en empresas privadas del sector del agua."], "correct": "B", "explanation": "El requisito 4 exige 'No haber sido excluido de otras bolsas de trabajo de Calidad Urbana del perfil de la presente convocatoria, en los últimos 3 años a la fecha de la finalización del período de inscripción'."}, {"id": 34, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 5", "question": "¿De cuántos días dispone la persona aspirante para la presentación de solicitudes tras la publicación de la convocatoria?", "options": ["10 días naturales.", "10 días hábiles.", "15 días hábiles.", "20 días naturales."], "correct": "B", "explanation": "La Base 5 estipula que 'El plazo de presentación de solicitudes comprenderá los 10 días hábiles siguientes a la publicación de la convocatoria a través de la página web de EMAYA'."}, {"id": 35, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 5", "question": "¿A través de qué plataforma telemática deben realizarse obligatoriamente las solicitudes de participación?", "options": ["En el Registro General de la sede electrónica del Ayuntamiento de Palma.", "A través de la plataforma accesible en la página web de EMAYA https://emaya.convoca.online/.", "Por correo electrónico dirigido al Departamento de Selección.", "Presencialmente en las oficinas de atención al cliente de Joan Maragall."], "correct": "B", "explanation": "La Base 5 señala que las solicitudes se realizarán a través de la plataforma a la que se accede desde la página web de EMAYA https://emaya.convoca.online/."}, {"id": 36, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 5", "question": "Al adjuntar la documentación requerida en la plataforma, ¿qué formato y requisito de escaneado se exige en las Bases?", "options": ["Archivos comprimidos en ZIP con tamaño superior a 10 MB.", "Copia escaneada legible en formato PDF o JPG, obligatoriamente por las dos caras salvo excepción acreditada.", "Fotografías en formato PNG tomadas con teléfono móvil sin requisito de reverso.", "Documentos físicos compulsados enviados por correo postal en 48 horas."], "correct": "B", "explanation": "La Base 5 indica que se adjuntará la documentación solicitada con copia escaneada legible en formato PDF o JPG escaneada por las dos caras."}, {"id": 37, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 5", "question": "¿Qué documento firmado de autobaremación debe incluirse junto a la solicitud de participación?", "options": ["Una declaración jurada notarial.", "Una declaración responsable y de autobaremación (alegación de méritos).", "Un certificado de penales emitido por el Ministerio de Justicia.", "Una propuesta metodológica para el puesto."], "correct": "B", "explanation": "La Base 5 detalla que la solicitud incluirá una declaración responsable y de autobaremación (alegación de méritos) que representa la veracidad de los documentos aportados."}, {"id": 38, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 6", "question": "¿Cuál es la distribución o porcentaje de ponderación global entre la fase de oposición y la fase de méritos fijada en la Base 6?", "options": ["50% oposición y 50% méritos.", "70% fase de oposición y 30% méritos.", "60% fase de oposición y 40% méritos.", "80% fase de oposición y 20% méritos."], "correct": "B", "explanation": "La Base 6 indica expresamente: 70% fase de oposición y 30% méritos."}, {"id": 39, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 6.1", "question": "Dentro de los 70 puntos de la fase de oposición, ¿cómo se desglose la puntuación entre las distintas pruebas?", "options": ["35 puntos prueba teórica y 35 puntos prueba práctica.", "50 puntos prueba teórica y 20 puntos prueba práctica y/o competencial.", "40 puntos prueba teórica, 20 práctica y 10 psicotécnicos.", "60 puntos prueba teórica y 10 puntos entrevista."], "correct": "B", "explanation": "La Base 6.1 reparte los 70 puntos de la oposición en: a) 50 puntos prueba teórica y b) 20 puntos prueba práctica y/o competenciales."}, {"id": 40, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 6.1.b", "question": "En la prueba práctica y/o competencial (valorada sobre 20 puntos), ¿cuál es la puntuación mínima requerida para no quedar eliminado/a del proceso?", "options": ["5 puntos.", "10 puntos.", "12 puntos.", "14 puntos."], "correct": "B", "explanation": "La Base 6.1.b estipula expresamente que 'Las personas aspirantes que no alcancen la puntuación de 10 puntos serán eliminadas del proceso'."}, {"id": 41, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 6.1", "question": "Con qué antelación mínima deben publicarse en la página web de EMAYA las fechas de realización de las pruebas de oposición?", "options": ["Mínimo 5 días hábiles.", "Mínimo 10 días naturales.", "Mínimo 15 días naturales.", "Mínimo 20 días hábiles."], "correct": "B", "explanation": "La Base 6.1 concreta que 'Las fechas de realización de las pruebas se publicarán en la página web de EMAYA mínimo 10 días naturales de antelación a su realización'."}, {"id": 42, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 6.2", "question": "¿Cuál es la puntuación máxima otorgable en la fase de concurso de méritos según las Bases?", "options": ["20 puntos.", "30 puntos.", "40 puntos.", "50 puntos."], "correct": "B", "explanation": "La Base 6.2 establece que la puntuación máxima de la fase de concurso de méritos será de 30 puntos."}, {"id": 43, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 6.2.1", "question": "En el baremo de méritos, ¿cuál es la puntuación asignada por cada día trabajado en EMAYA Calidad Urbana en la categoría de Auxiliar Administrativo/a o equivalente?", "options": ["0,005 puntos por día.", "0,015 puntos por día.", "0,100 puntos por día.", "0,500 puntos por mes."], "correct": "B", "explanation": "La Base 6.2.1 fija que 'Se otorgarán 0,015 puntos por cada día trabajado en EMAYA Calidad Urbana' hasta un máximo de 25 puntos de experiencia."}, {"id": 44, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 6.2.1", "question": "¿A qué período temporal máximo se limita la valoración de la experiencia profesional acreditada en la fase de concurso?", "options": ["Únicamente a los últimos 3 años.", "A la experiencia realizada en los últimos 10 años.", "Toda la vida laboral sin límite temporal.", "A los últimos 5 años contados desde la fecha de examen."], "correct": "B", "explanation": "Las Bases matizan explícitamente que 'Solo se valorará la experiencia realizada en los últimos 10 años'."}, {"id": 45, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 8", "question": "Antes de la incorporación efectiva al puesto de trabajo, ¿qué se requerirá a los candidatos/as seleccionados que hayan presentado copias en la solicitud?", "options": ["Aportar la documentación original o copia compulsada, junto con un currículum vitae actualizado.", "Firmar una fianza económica de permanencia de dos años.", "Acreditar certificado de empadronamiento en Palma de más de 5 años.", "Repetir la prueba teórica de verificación."], "correct": "A", "explanation": "La Base 8 indica que las personas que hayan presentado copias serán requeridas para aportar la documentación original o copia compulsada, junto con un curriculum vitae actualizado."}, {"id": 46, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 8", "question": "¿Qué dictamen médico se exige tras el reconocimiento médico de empresa para que los resultados finales tengan carácter definitivo?", "options": ["Aptitud con restricciones leves de movilidad.", "Aptitud y sin restricciones (excepto personal con discapacidad).", "Aptitud condicional sujeta a revisión semestral.", "Informe favorable emitido por la Seguridad Social exclusivamente."], "correct": "B", "explanation": "La Base 8 dispone que si la persona candidata es declarada apta y sin restricciones (excepto personal con discapacidad) los resultados finales tendrán carácter de definitivos."}, {"id": 47, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 5", "question": "Si en cualquier momento del proceso selectivo el Tribunal detecta la no veracidad de algún dato aportado en la declaración responsable:", "options": ["Se concederá un plazo de 10 días para subsanar el error.", "Supondrá la exclusión automática del proceso selectivo.", "Se aplicará una penalización de 5 puntos en la fase de oposición.", "Se derivará la decisión al comité de empresa."], "correct": "B", "explanation": "La Base 5 advierte expresamente que 'Si en cualquier momento del proceso de selección el Tribunal tiene conocimiento de la no veracidad de algún dato aportado por la persona aspirante, supondrá la exclusión automática'."}, {"id": 48, "block": "3. Bases Específicas Convocatoria Aux. Admin.", "source": "Bases Específicas, Base 8", "question": "En caso de renuncia a la plaza adjudicada o no superación del período de prueba por el ganador/a:", "options": ["La plaza quedará desierta hasta la siguiente OPE anual.", "Ocupará su lugar la siguiente persona del listado definitivo.", "Se convocará un nuevo concurso-oposición extraordinario.", "Se amortizará la plaza vacante de forma definitiva."], "correct": "B", "explanation": "La Base 8 contempla que en caso de renuncia o no superación del período de prueba 'ocupará su lugar la siguiente persona del listado'."}, {"id": 49, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 2.1", "question": "¿Cuál es el objeto principal de la Ley 31/1995 de Prevención de Riesgos Laborales según su artículo 2.1?", "options": ["Regular la jubilación anticipada en actividades penosas o insalubres.", "Promover la seguridad y la salud de los trabajadores mediante la aplicación de medidas y el desarrollo de actividades preventivas.", "Establecer las indemnizaciones por accidentes de trabajo a cargo de las mutuas.", "Sancionar económicamente a las empresas que registren bajas laborales."], "correct": "B", "explanation": "El Art. 2.1 señala que la norma tiene por objeto promover la seguridad y la salud de los trabajadores mediante la aplicación de medidas y el desarrollo de las actividades necesarias para la prevención."}, {"id": 50, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 2.2", "question": "Las disposiciones de la Ley de Prevención de Riesgos Laborales y sus reglamentos tienen el carácter de:", "options": ["Normas de recomendación técnica dispositivas.", "Derecho necesario mínimo indisponible.", "Directrices orientativas adaptables por pacto individual.", "Estatutos internos de carácter privado."], "correct": "B", "explanation": "El Art. 2.2 establece expresamente que las disposiciones sobre prevención tienen el carácter de derecho necesario mínimo indisponible."}, {"id": 51, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 14.1", "question": "Según el Art. 14.1, el derecho de los trabajadores a una protección eficaz en materia de seguridad y salud supone la existencia de:", "options": ["Una obligación compartida a partes iguales con los servicios médicos públicos.", "Un correlativo deber del empresario de protección de los trabajadores frente a los riesgos laborales.", "Una responsabilidad facultativa dependiente del presupuesto anual.", "Un seguro privado obligatorio financiado por el trabajador."], "correct": "B", "explanation": "El Art. 14.1 dispone que el citado derecho de protección eficaz supone la existencia de un correlativo deber del empresario de protección frente a los riesgos laborales."}, {"id": 52, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 14.2", "question": "¿Qué derechos forman parte integrante del derecho a una protección eficaz según el Art. 14.2?", "options": ["Información, consulta y participación, formación, paralización en riesgo grave e inminente y vigilancia de la salud.", "Elección de turno de trabajo, vacaciones flexibles y prima salarial de riesgo.", "Prestación económica por incapacidad y jubilación bonificada.", "Asistencia jurídica gratuita y contratación de seguro privado."], "correct": "A", "explanation": "El Art. 14.2 explicita que los derechos de información, consulta y participación, formación en materia preventiva, paralización de actividad en riesgo grave e inminente y vigilancia de la salud forman parte de la protección eficaz."}, {"id": 53, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 15.1.a", "question": "En el marco de los principios de la acción preventiva (Art. 15.1), ¿cuál es el primer principio que debe aplicar el empresario?", "options": ["Evaluar los riesgos que no se puedan evitar.", "Evitar los riesgos.", "Sustituir lo peligroso por lo que entrañe poco o ningún peligro.", "Dar las debidas instrucciones a los trabajadores."], "correct": "B", "explanation": "El Art. 15.1 enumera como primer principio de la acción preventiva (apartado a): 'Evitar los riesgos'."}, {"id": 54, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 15.1.d", "question": "¿En qué consiste el principio preventivo relativo a la 'adaptación del trabajo a la persona' (Art. 15.1.d)?", "options": ["Permitir que el trabajador decida libremente su horario laboral.", "Concebir los puestos, elegir equipos y métodos de trabajo para atenuar el trabajo monótono y repetitivo.", "Eximir del cumplimiento de objetivos a las personas con cansancio.", "Garantizar el teletrabajo al 100% en todas las categorías."], "correct": "B", "explanation": "El Art. 15.1.d contempla 'Adaptar el trabajo a la persona, en particular en lo que respecta a la concepción de los puestos de trabajo, así como a la elección de los equipos y los métodos de trabajo y de producción'."}, {"id": 55, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 15.1.h", "question": "Respecto a la adopción de medidas de protección, ¿qué orden de preferencia establece el Art. 15.1.h?", "options": ["Anteponer las medidas de protección individual sobre las colectivas.", "Adoptar medidas que antepongan la protección colectiva a la individual.", "Utilizar únicamente EPIs descartando reformas estructurales.", "Dejar la elección a criterio del comité de seguridad y salud."], "correct": "B", "explanation": "El Art. 15.1.h dispone obligatoriamente 'Adoptar medidas que antepongan la protección colectiva a la individual'."}, {"id": 56, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 16.1", "question": "Según el Art. 16.1, la evaluación de los riesgos laborales debe actualizarse cuando:", "options": ["Cambien las condiciones de trabajo o se hayan producido daños para la salud.", "Transcurra un plazo máximo imprevisto de 5 años.", "Lo solicite por escrito cualquier trabajador de forma individual.", "Se renueve el Consejo de Administración de la empresa."], "correct": "A", "explanation": "El Art. 16.1 precisa que la evaluación será revisada cuando cambien las condiciones de trabajo y con ocasión de los daños para la salud que se hayan producido."}, {"id": 57, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 17.2", "question": "En relación con los Equipos de Protección Individual (EPI), el Art. 17.2 establece que el empresario debe:", "options": ["Proporcionarlos cobrando el 50% de su coste en nómina.", "Proporcionar gratuitamente a los trabajadores los equipos de protección adecuados y velar por su uso efectivo.", "Exigir que el trabajador los adquiera en el mercado y presente factura.", "Suministrarlos únicamente si el comité de empresa los financia."], "correct": "B", "explanation": "El Art. 17.2 determina que el empresario deberá proporcionar gratuitamente a los trabajadores los equipos de protección individual adecuados para el desempeño de sus funciones."}, {"id": 58, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 22.1", "question": "Como regla general, las medidas de vigilancia de la salud practicadas por el empresario tienen carácter:", "options": ["Obligatorio en todo caso sin excepción.", "Voluntario para el trabajador, salvo en los supuestos específicos previstos en la Ley.", "Confidencial solo para la representación sindical.", "Gratuito únicamente para el personal fijo."], "correct": "B", "explanation": "El Art. 22.1 establece que esta vigilancia solo podrá llevarse a cabo cuando el trabajador preste su consentimiento, con excepciones específicas (imprescindibles para evaluar efectos, verificación de aptitud, riesgo para terceros)."}, {"id": 59, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 26.1", "question": "En caso de riesgo para la embarazada o la lactancia natural (Art. 26.1), si la adaptación de las condiciones de trabajo no resulta posible, el empresario deberá:", "options": ["Despedir procedentemente a la trabajadora con indemnización.", "Destinar a la trabajadora a un puesto o función diferente y compatible con su estado.", "Conceder vacaciones no retribuidas hasta el parto.", "Obligar a la trabajadora a solicitar la invalidez permanente."], "correct": "B", "explanation": "El Art. 26.1 y 26.2 establece que cuando la adaptación no sea posible, la trabajadora deberá desempeñar un puesto de trabajo o función diferente y compatible con su estado."}, {"id": 60, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 27.1", "question": "Antes de la incorporación al trabajo de jóvenes menores de 18 años (Art. 27.1), el empresario debe efectuar una evaluación de los puestos considerando específicamente:", "options": ["Su rendimiento académico y notas de secundaria.", "Los riesgos específicos para su seguridad derivados de su falta de experiencia, imprecisa percepción de riesgos o incompleto desarrollo.", "La autorización notarial del tutor legal.", "Su condición física en pruebas de atletismo."], "correct": "B", "explanation": "El Art. 27.1 obliga a efectuar una evaluación de los puestos a desempeñar por menores de 18 años teniendo en cuenta los riesgos derivados de su falta de experiencia, inmadurez o desarrollo incompleto."}, {"id": 61, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 29.1", "question": "Según el Art. 29.1, corresponde a cada trabajador velar por su propia seguridad y salud en el trabajo y por la de aquellas otras personas a las que pueda afectar su actividad profesional:", "options": ["Solo si ha firmado un contrato de jefatura.", "Según sus posibilidades y mediante el cumplimiento de las medidas de prevención que en cada caso sean adoptadas.", "En función de la retribución económica que perciba.", "Únicamente en jornada ordinaria de mañana."], "correct": "B", "explanation": "El Art. 29.1 estipula que corresponde a cada trabajador velar por su propia seguridad y salud conforme a su formación y a las instrucciones del empresario."}, {"id": 62, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 29.2.1º", "question": "De acuerdo con el Art. 29.2.1º, los trabajadores deberán en particular usar adecuadamente las máquinas, aparatos, herramientas y sustancias peligrosas de acuerdo con:", "options": ["Su propio criterio de eficiencia sin consultar manuales.", "Su formación y las instrucciones recibidas del empresario.", "Las costumbres habituales del sector.", "Lo indicado por los compañeros más antiguos."], "correct": "B", "explanation": "El Art. 29.2.1º especifica que se deben usar adecuadamente los medios 'de conformidad con su formación y las instrucciones recibidas del empresario'."}, {"id": 63, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 35.1", "question": "¿Quiénes son los Delegados de Prevención según el artículo 35.1 de la Ley 31/1995?", "options": ["Técnicos externos contratados por los servicios de prevención ajenos.", "Los representantes de los trabajadores con funciones específicas en materia de prevención de riesgos en el trabajo.", "Los inspectores de Trabajo y Seguridad Social adscritos a la empresa.", "Los miembros del Consejo de Administración encargados de la salud."], "correct": "B", "explanation": "El Art. 35.1 define a los Delegados de Prevención como los representantes de los trabajadores con funciones específicas en materia de prevención de riesgos en el trabajo."}, {"id": 64, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 35.2", "question": "¿Cómo son designados los Delegados de Prevención en las empresas (Art. 35.2)?", "options": ["Directamente por el empresario entre el personal técnico.", "Por y entre los representantes del personal (comité de empresa / delegados de personal).", "Por votación popular de los vecinos del municipio.", "Por designación del Ministerio de Trabajo."], "correct": "B", "explanation": "El Art. 35.2 determina que los Delegados de Prevención serán designados por y entre los representantes del personal en el ámbito de los respectivos órganos de representación."}, {"id": 65, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 38.1", "question": "¿En qué empresas o centros de trabajo debe constituirse obligatoriamente un Comité de Seguridad y Salud según el Art. 38.1?", "options": ["En todas las empresas con más de 10 trabajadores.", "En todas las empresas o centros de trabajo que cuenten con 50 o más trabajadores.", "Solo en empresas de alto riesgo industrial.", "En empresas con volumen de facturación superior a 1 millón de euros."], "correct": "B", "explanation": "El Art. 38.1 indica que se constituirá un Comité de Seguridad y Salud en todas las empresas o centros de trabajo que cuenten con 50 o más trabajadores."}, {"id": 66, "block": "4. Ley 31/1995 de Prevención de Riesgos Laborales", "source": "Ley 31/1995, Art. 38.2", "question": "¿Cuál es la composición y naturaleza del Comité de Seguridad y Salud según el Art. 38.2?", "options": ["Órgano consultivo exclusivo de la Dirección de la empresa.", "Órgano paritario y colegiado de participación destinado a la consulta regular y periódica, formado por los Delegados de Prevención y el empresario/representantes.", "Tribunal sancionador de faltas laborales en materia de seguridad.", "Comisión técnica integrada únicamente por médicos del trabajo."], "correct": "B", "explanation": "El Art. 38.2 define al Comité de Seguridad y Salud como el órgano paritario y colegiado de participación destinado a la consulta regular y periódica, constituido por los Delegados de Prevención y por el empresario/sus representantes."}, {"id": 67, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 1.1", "question": "Según el Art. 1.1 de la Ordenanza Municipal de Limpieza de Palma, la gestión de residuos y control de espacios se realizará respetando el principio de:", "options": ["Libre mercado y mínima intervención municipal.", "Jerarquía de residuos (prevención, preparación reutilización, reciclaje, valorización y eliminación).", "Incineraicón obligatoria de la totalidad de fracciones.", "Vertido directo en instalaciones insulares."], "correct": "B", "explanation": "El Art. 1.1 explicita que se regulará respetando el principio de jerarquía (prevención, preparación para la reutilización, reciclaje, otras formas de valorización y eliminación)."}, {"id": 68, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 2", "question": "¿Cuál de los siguientes residuos queda EXPRESAMENTE EXCLUIDO de la regulación de la Ordenanza Municipal según su Art. 2?", "options": ["Los envases ligeros y de plástico domiciliarios.", "Los residuos radiactivos y explosivos.", "Los residuos voluminosos de los hogares.", "Los aceites vegetales usados en cocinas."], "correct": "B", "explanation": "El Art. 2 recoge expresamente las exclusiones de la ordenanza, entre las que figuran los residuos radiactivos, los peligrosos no asimilables, los explosivos, los efluentes gaseosos y las aguas residuales."}, {"id": 69, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 3.y", "question": "Según las definiciones del Art. 3.y, ¿qué es un 'Parque Verde'?", "options": ["Un jardín público con zona de juegos infantiles.", "Un área de aportación de titularidad municipal cerrada y delimitada con calificación por el Consell de Mallorca.", "Un vertedero al aire libre en polígonos industriales.", "Un contenedor móvil situado en autobuses urbanos."], "correct": "B", "explanation": "El Art. 3.y define Parque Verde como el 'Área de aportación de titularidad municipal cerrada y delimitada y que tenga esta calificación por parte del Consejo de Mallorca'."}, {"id": 70, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 3.aa", "question": "¿Cómo se definen los 'Voluminosos' en el Art. 3.aa de la Ordenanza?", "options": ["Residuos de envases ligeros sin aplastar.", "Residuos generados en hogares con características especiales de volumen, peso o tamaño que dificultan su recogida ordinaria.", "Cualquier residuo industrial producido por grandes comercios.", "Residuos líquidos procedentes del barrido."], "correct": "B", "explanation": "El Art. 3.aa define Voluminosos como aquellos residuos generados en los hogares con características de volumen, peso o tamaño que dificulten su recogida ordinaria."}, {"id": 71, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 14.1", "question": "De acuerdo con el Art. 14.1, queda totalmente prohibido en las vías y espacios públicos:", "options": ["Pasear a pie portando bolsas cerradas de basura.", "Arrojar todo tipo de desperdicios como colillas, cáscaras, envoltorios, latas o envases.", "Utilizar las papeleras municipales para tirar un billete de autobús.", "Circular con vehículos de limpieza viaria."], "correct": "B", "explanation": "El Art. 14.1 prohíbe arrojar a las vías públicas todo tipo de desperdicios (colillas, masticables, cáscaras, papeles, plásticos, latas, etc.)."}, {"id": 72, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 14.6", "question": "Respecto a las aguas residuales, el Art. 14.6 prohíbe expresamente vaciar o evacuar aguas residuales de cualquier tipo sobre la vía pública y en especial:", "options": ["En la red general de alcantarillado.", "En los alcorces de los árboles que puedan afectar al patrimonio arbóreo.", "En las instalaciones de depuración de EMAYA.", "En los tanques de tormenta autorizados."], "correct": "B", "explanation": "El Art. 14.6 prohíbe evacuar aguas residuales sobre vías públicas, 'incluido los vertidos de aguas residuales en los alcorces de los árboles'."}, {"id": 73, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 15.1", "question": "Según el Art. 15.1, respecto a papeleras y contenedores ubicados en la vía pública, queda prohibido:", "options": ["Depositar residuos ocasionales en las papeleras.", "Toda manipulación, desplazar, vaciar, volcar, arrancar o realizar cualquier acto que los deteriore o inutilice.", "Cerrar la tapa del contenedor tras su uso.", "Consultar las instrucciones impresas en el contenedor."], "correct": "B", "explanation": "El Art. 15.1 prohíbe toda manipulación de papeleras y contenedores, así como desplazarlos, vaciarlos, volcarlos, arrancarlos o deteriorarlos."}, {"id": 74, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 15.2", "question": "¿A qué uso se reserva exclusivamente el servicio de papeleras según el Art. 15.2 de la Ordenanza?", "options": ["A depositar las bolsas de basura doméstica diarias.", "A los residuos ocasionalmente producidos por los viandantes.", "A los residuos comerciales de pequeños locales contiguos.", "A restos de poda y jardinería domiciliaria."], "correct": "B", "explanation": "El Art. 15.2 establece que 'El uso de las papeleras y recipientes similares, se reserva exclusivamente a los residuos ocasionalmente producidos por los viandantes'."}, {"id": 75, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 16.3 y 16.4", "question": "En las playas y zonas de baño públicas (Art. 16), queda especialmente prohibido por razones de seguridad y protección ambiental:", "options": ["El uso de sombrillas de tela.", "Encender hogueras/fuegos sin autorización, usar jabón en duchas/lavapies y la introducción de envases de vidrio.", "Bañarse en horario diurno.", "Caminar descalzo sobre la arena."], "correct": "B", "explanation": "El Art. 16 prohíbe expresamente verter residuos, encender fuegos/hogueras, usar jabón en duchas y la introducción de envases de vidrio en playas."}, {"id": 76, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 28.2", "question": "Según el Art. 28.2, el servicio de recogida de residuos domésticos generados en hogares, comercios y servicios es un servicio municipal de:", "options": ["Prestación voluntaria y recepción optativa.", "Prestación obligatoria por el Ayuntamiento y de recepción obligatoria por la ciudadanía y generadores.", "Gestión privada sin tutela pública.", "Contratación libre en régimen de competencia desregulada."], "correct": "B", "explanation": "El Art. 28.2 indica que 'Éste es un servicio de prestación obligatoria por parte del Ayuntamiento de Palma y de recepción obligatoria por las personas físicas o jurídicas'."}, {"id": 77, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 45.1", "question": "¿En qué franja horaria deben depositarse los residuos de envases de vidrio en los contenedores específicos (Art. 45.1)?", "options": ["Las 24 horas del día sin restricción.", "Entre las 08:00 y las 22:00 horas.", "De 20:00 a 23:00 horas únicamente.", "De 00:00 a 06:00 horas de la madrugada."], "correct": "B", "explanation": "El Art. 45.1 fija que los residuos de envases de vidrio deberán depositarse en el interior de los contenedores entre las 08'00 y las 22'00 horas para minimizar molestias de ruido."}, {"id": 78, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 45.2 y 46.2", "question": "Antes de depositar botellas, botes o latas en los contenedores de vidrio o envases ligeros, ¿qué obligación previa impone la Ordenanza?", "options": ["Lavar los recipientes con detergente industrial.", "Vaciar completamente su contenido previo.", "Retirar las etiquetas de papel mediante disolvente.", "Rromper el vidrio en fragmentos pequeños."], "correct": "B", "explanation": "Los Arts. 45.2 y 46.2 estipulan que en el caso de recipientes con restos de contenido, 'los ciudadanos deberán vaciar estos recipientes por completo con carácter previo'."}, {"id": 79, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 47.1", "question": "En relación con la fracción de papel y cartón (Art. 47.1), ¿cómo deben depositarse las cajas de cartón en los contenedores azules?", "options": ["Enteras sin modificar para no romper las fibras.", "Debidamente cortadas y dobladas para reducir el volumen e introducirlas en el contenedor.", "Mojadas previamente para que ocupen menos espacio.", "Apiladas sobre la tapa superior del contenedor."], "correct": "B", "explanation": "El Art. 47.1 establece que 'las cajas de cartón serán cortadas y dobladas de forma adecuada para su introducción y disposición en los contenedores'."}, {"id": 80, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 47.2", "question": "En el caso de que el contenedor específico de papel y cartón se encuentre totalmente lleno (Art. 47.2), la Ordenanza permite:", "options": ["Tirar el cartón dentro del contenedor de rechazo.", "Depositarlo debidamente plegado y en paquetes atados junto al contenedor específico.", "Quemarlo de forma controlada en la acera.", "Dejarlo disperso por la calzada."], "correct": "B", "explanation": "El Art. 47.2 señala que en caso de estar lleno el contenedor, el papel/cartón 'podrá depositarse debidamente plegado y en paquetes atados junto al contenedor específico'."}, {"id": 81, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 48.1", "question": "Respecto a los aceites vegetales usados generados en los domicilios (Art. 48.1), la Ordenanza prohibe categóricamente:", "options": ["Reciclarlos en recipientes de plástico.", "Verter aceites por los desagües y red de pluviales.", "Entregarlos en los parques verdes.", "Reutilizar botellas de agua para su almacenamiento."], "correct": "B", "explanation": "El Art. 48.1 sanciona rotundamente: 'Está prohibido verter aceites por los desagües y red de pluviales'."}, {"id": 82, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 53.7", "question": "En las zonas clasificadas como suelo urbano dentro del término municipal (Art. 53.7), está prohibido:", "options": ["El uso de barbacoas de gas en patios privados.", "La realización de quemas controladas de residuos.", "El barrido manual de terrazas.", "El riego de plantas en balcones."], "correct": "B", "explanation": "El Art. 53.7 determina expresamente: 'En zonas clasificadas como suelo urbano se prohibe la realización de quemas controladas'."}, {"id": 83, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 44.5", "question": "Según el Art. 44.5 de la Ordenanza Municipal, respecto al tratamiento de materia orgánica en origen, el Ayuntamiento:", "options": ["Prohibirá el compostaje particular por razones de olor.", "Fomentará e impulsará la realización del compostaje domiciliario, estableciendo sus requisitos.", "Obligará a comprar composteras importadas de la UE.", "Cobrará un impuesto especial a las viviendas con jardín."], "correct": "B", "explanation": "El Art. 44.5 especifica que 'El Ayuntamiento fomentará e impulsará la realización del compostaje domiciliario, estableciendo los requisitos para el mismo'."}, {"id": 84, "block": "5. Ordenanza Municipal de Limpieza y Residuos", "source": "Ordenanza Municipal, Art. 16.6", "question": "Las concesiones administrativas de actividades en playas (Art. 16.6) deben depositar los residuos procedentes de la limpieza de su zona exclusivamente en:", "options": ["La orilla del mar durante la marea baja.", "Bolsas cerradas y en los contenedores situados a tal fin, tratados como residuos domésticos.", "Papeleras de viandantes distribuidas por el paseo marítimo.", "Poos ciegos excavados en la arena."], "correct": "B", "explanation": "El Art. 16.6 establece que los residuos procedentes de concesiones en playas 'se depositarán, exclusivamente, en bolsas cerradas y en los contenedores situados a tal fin'."}, {"id": 85, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Recogida Polígonos", "question": "¿En qué áreas industriales de Palma realiza EMAYA el servicio de recogida puerta a puerta para empresas según el documento 5?", "options": ["Únicamente en el Polígono de Son Castelló.", "Son Castelló, Son Rossinyol, Can Valero, Son Valentí, Son Morro, Son Malferit, Son Oms, sa Tàpia y Coll d'en Rabassa.", "Solo en los polígonos colindantes con el aeropuerto.", "Exclusivamente en parques tecnológicos fuera de la Vía de Cincunvalación."], "correct": "B", "explanation": "El documento 5 enumera todos los polígonos industriales beneficiarios del servicio puerta a puerta empresarial."}, {"id": 86, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Recogida Polígonos", "question": "¿Cuál era el porcentaje inicial de recogida selectiva registrado en los polígonos industriales antes de implantar el puerta a puerta, frente a la media de Palma?", "options": ["2% en polígonos frente al 50% de media.", "8,5% en polígonos frente al 25% de media en Palma.", "15% en polígonos frente al 20% de media.", "30% en polígonos frente al 10% de media."], "correct": "B", "explanation": "El documento señala que en los polígonos solo se recogía de forma selectiva el 8,5% de los residuos, cuando en el conjunto de Palma la media era del 25%."}, {"id": 87, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Recogida Polígonos", "question": "¿Con qué cuantía de multa se sanciona la mezcla de residuos peligrosos con la fracción rechazo en las empresas de polígonos industriales?", "options": ["Hasta 500 euros.", "Multas de hasta 3.000 euros.", "Hasta 10.000 euros con cierre de negocio.", "No se contempla multa económica."], "correct": "B", "explanation": "El texto advierte textualmente: 'Mezclar estos residuos con el rechazo se sancionará con multas de hasta 3.000 €'."}, {"id": 88, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Centro Histórico", "question": "¿En qué barrios del centro histórico realiza EMAYA el servicio de recogida puerta a puerta de residuos comerciales?", "options": ["Santa Catalina y Es Jonquet exclusivamente.", "La Seu, Cort, la Llotja-el Born, el Puig de Sant Pere, Sant Jaume y Sant Nicolau.", "Son Gotleu y Pere Garau.", "Plaza de España y Avenidas exclusivamente."], "correct": "B", "explanation": "El documento detalla que la recogida comercial puerta a puerta abarca los barrios de la Seu, Cort, la Llotja-el Born, el Puig de Sant Pere, Sant Jaume y Sant Nicolau."}, {"id": 89, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Centro Histórico", "question": "¿A partir de qué volumen de generación de residuos se deben acoger obligatoriamente los comercios del centro histórico al calendario comercial puerta a puerta?", "options": ["Generación superior a 50 litros.", "Cantidad no asimilable a domésticos, establecida en 120 litros o más.", "Producción superior a 500 litros diarios.", "Todas las actividades sin importar su volumen."], "correct": "B", "explanation": "Los establecimientos deben acogerse excepto para fracciones en las que se genere una cantidad asimilable a domésticos (menos de 120 litros)."}, {"id": 90, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Centro Histórico", "question": "¿Qué coste añadido supone para los comercios y restaurantes adheridos el servicio de recogida puerta a puerta en el centro histórico?", "options": ["Una tasa mensual fija de 50 euros.", "Este servicio no tiene un coste añadido para los establecimientos.", "Un recargo del 10% en el recibo del agua.", "Pago por kilo entregado al operario."], "correct": "B", "explanation": "El documento 5 afirma explícitamente: 'Este servicio no tiene un coste añadido para los establecimientos'."}, {"id": 91, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Parques Verdes", "question": "Los Parques Verdes de Palma son de uso exclusivo para:", "options": ["Cualquier persona o empresa de la isla de Mallorca.", "Residentes particulares de Palma.", "Empresas de construcción para escombros industriales.", "Turistas no residentes durante el verano."], "correct": "B", "explanation": "Las normas de uso indican claramente: 'Son de uso exclusivo para residentes de Palma. Son para usuarios particulares'."}, {"id": 92, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Parques Verdes", "question": "¿Cuál es el límite máximo diario de escombros de obras menores aceptado para particulares en los Parques Verdes de Palma?", "options": ["1 saco por persona y día.", "5 sacos de escombros por persona y día.", "10 sacos por persona y día.", "Sin límite de cantidad para particulares."], "correct": "B", "explanation": "Las normas fijan que para particulares 'se aceptan 5 sacos de escombros por persona y día'."}, {"id": 93, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Parques Verdes", "question": "¿Cuál es el horario general de apertura y última admisión de los Parques Verdes de Palma?", "options": ["De 09:00 a 14:00 h.", "Abiertos cada día de 8 a 20 h (última admisión 19.45 h).", "De lunes a viernes de 08:00 a 15:00 h.", "Las 24 horas del día mediante tarjeta magnética."], "correct": "B", "explanation": "El documento especifica: 'Abiertos cada día de 8 a 20 h. (última admisión 19.45 h)'."}, {"id": 94, "block": "6. Nociones Básicas de Gestión de Residuos", "source": "Doc 5, Datos 2024", "question": "Según los datos oficiales del documento 5, ¿cuántas toneladas de residuos urbanos generó Palma en el año 2024?", "options": ["100.000 toneladas.", "235.584 toneladas.", "500.000 toneladas.", "150.200 toneladas."], "correct": "B", "explanation": "El texto recoge que 'Palma generó, en el año 2024, 235.584 toneladas de residuos'."}, {"id": 95, "block": "6. Nociones Básicas de Gestión os, vasos, bombillas y fluorescentes NO van al contenedor verde de vidrio."}, {"id": 99, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Contenedor Azul", "question": "Según la Guía de buenas prácticas, ¿cuántos árboles se salvan con el reciclaje de una tonelada de papel?", "options": ["5 árboles.", "17 árboles.", "50 árboles.", "100 árboles."], "correct": "B", "explanation": "La guía recoge el dato divulgativo: 'Una tonelada de papel reciclado salva 17 árboles'."}, {"id": 100, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Contenedor Marrón", "question": "¿Qué materiales deben depositarse en el contenedor marrón de fracción orgánica?", "options": ["Excrementos de animales y pañales.", "Restos de comida, pan, posos de café/infusiones, papel de cocina manchado y pequeños restos vegetales.", "Polvo de barrer y bolsas de aspiradora.", "Cenizas de chimenea y colillas."], "correct": "B", "explanation": "La orgánica incluye restos de comida, pan, posos, papel de cocina manchado y restos vegetales no tratados con pesticidas."}, {"id": 101, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Horarios", "question": "¿Cuál es el horario fijado para depositar las bolsas de basura en los contenedores de orgánica y rechazo en Palma?", "options": ["De 08:00 a 14:00 horas.", "De 19:00 a 23:00 horas.", "De 12:00 a 16:00 horas.", "Durante las 24 horas del día."], "correct": "B", "explanation": "El horario oficial de depósito indicado para la fracción resto/rechazo y orgánica es de 19 a 23 h."}, {"id": 102, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Aceite", "question": "¿Cómo debe entregarse el aceite de cocina usado para su correcto reciclaje en el contenedor o punto de recogida de aceite?", "options": ["Vertido directamente sin envase en el depósito.", "En botellas de plástico cerradas (de máximo 2 litros).", "Mezclado con agua y jabón en recipientes de cristal.", "En latas metálicas abiertas."], "correct": "B", "explanation": "La guía instruye: 'Depositad el aceite de cocina usado, cuando esté frío, en botellas de plástico cerradas (de un máximo de 2 litros)'."}, {"id": 103, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Aceite", "question": "Según la Guía, ¿cuántos litros de agua puede llegar a contaminar 1 litro de aceite de cocina vertido por el desagüe?", "options": ["10 litros.", "100 litros.", "1.000 litros de agua.", "10.000 litros."], "correct": "C", "explanation": "El documento resalta como alerta ambiental: 'Un litro de aceite de cocina puede contaminar 1.000 litros de agua'."}, {"id": 104, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Contenedor Gris", "question": "¿Qué elementos deben ir obligatoriamente al contenedor de Rechazo (Gris/Contenedor de resto)?", "options": ["Briks de leche y latas de refresco.", "Pañales, compresas, tampones, colillas, cenizas, polvo de barrer y objetos de loza o cristal roto.", "Cajas de cartón y periódicos.", "Aceite vegetal usado y pilas."], "correct": "B", "explanation": "Al rechazo van los residuos no reciclables en otras fracciones como pañales, compresas, cenizas, polvo de barrer, vajilla rota y excrementos."}, {"id": 105, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Orgánica", "question": "¿En qué se transforma la materia orgánica recogida en el contenedor marrón tras su tratamiento en planta?", "options": ["En combustible diésel sintético.", "En abono o compost para agricultura y jardinería.", "En envases plásticos reciclados.", "Se incinera en Son Reus directamente."], "correct": "B", "explanation": "La guía indica que la orgánica se transporta a plantas de compostaje donde se somete a un proceso de transformación en abono o compost."}, {"id": 106, "block": "7. Recogida Selectiva y Separación", "source": "Guía Recogida Selectiva, Trastos", " iento de Gestión de Calidad para solicitudes, quejas y sugerencias en EMAYA?", "options": ["PGQ-001, Versión 1.", "PGQ-043, Versión 8 (de fecha 04/08/2021).", "ISO-9001, Versión 2015.", "PGQ-100, Versión 5."], "correct": "B", "explanation": "El encabezado oficial del documento establece: 'Gestión de Solicitudes, Quejas y Sugerencias, Código: PGQ-043, Versión: 8, Fecha: 4.8.2021'."}, {"id": 110, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Objeto", "question": "¿Cuál es el objeto del procedimiento PGQ-043 según su apartado 1?", "options": ["Fijar las tarifas del agua potable para el municipio de Palma.", "Determinar los criterios para gestionar las solicitudes, quejas o sugerencias de los clientes para mejorar la calidad del servicio.", "Regular el régimen disciplinario interno del personal de administración.", "Establecer los turnos de guardia en la planta depuradora."], "correct": "B", "explanation": "El apartado 1 Objeto define: 'Determinar los criterios para gestionar las solicitudes, quejas o sugerencias que los clientes pueden formular en relación con los servicios que EMAYA ofrece'."}, {"id": 111, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Apartado 3.2", "question": "En el apartado de definiciones (3.2), ¿cómo se define el término 'Cliente'?", "options": ["Cualquier persona titular de una póliza de suministro de agua vigente.", "Cualquier persona que contacta o podría contactar con EMAYA, tenga o no relación contractual.", "Únicamente las empresas registradas en el padrón de alcantarillado.", "Los concejales del Ayuntamiento de Palma."], "correct": "B", "explanation": "El apartado 3.2 define Cliente como 'cualquier persona que contacta o podría contactar con EMAYA, tenga o no relación contractual'."}, {"id": 112, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Apartado 3.2", "question": "¿Qué es una 'Solicitud de información' según la definición 3.2 del PGQ-043 iento PGQ-043, Apartado 4.1", "question": "¿Cuáles de los siguientes son canales de entrada habilitados para formular demandas según el apartado 4.1?", "options": ["Redes sociales personales de los trabajadores.", "www.emaya.es, teléfonos (971 240 240 / 900 533 692), presencial en Joan Maragall con cita previa, correo postal y DMS.", "Exclusivamente por burofax notarial.", "Llamada directa al parque de bomberos."], "correct": "B", "explanation": "El apartado 4.1 detalla los canales habilitados: Web www.emaya.es, teléfonos 971 240 240 y 900 533 692, presencial en oficinas de Joan Maragall, correo postal y DMS."}, {"id": 116, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Apartado 4.2 / 4.3", "question": "¿En qué sistema informático corporativo deben registrarse e introducirse todas las demandas recibidas en EMAYA?", "options": ["En una hoja de cálculo local no compartida.", "En el sistema SAP (generando el correspondiente número de aviso).", "En la base de datos de la Policía Local.", "En el registro del Gobierno Balear."], "correct": "B", "explanation": "El procedimiento especifica que todas las demandas deben introducirse en el sistema registrando el aviso en SAP y proporcionando el código de identificación asignado."}, {"id": 117, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Apartado 4.3 / 4.5", "question": "¿En qué idioma se comunicará por defecto la recepción y resolución de la demanda al interesado según el procedimiento PGQ-043?", "options": ["En idioma castellano exclusivamente.", "En idioma catalán, excepto si la persona interesada solicita la versión en castellano.", "En inglés y alemán por ser zona turística.", "En el idioma elegido libremente por el operador."], "correct": "B", "explanation": "Los apartados 4.3 y 4.5 establecen que se utilizará el idioma catalán, 'excepto en el supuesto de que la persona interesada solicite la versión en castellano (en aplicación del Reglamento de normalización lingüística)'."}, {"id": 118, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Apartado 4.5", "question": "¿Cuál es el plazo máximo obligatorio para resolver y comunicar la respuesta a las demandas según el apartado 4.5?", "options": ["En un plazo no superior a 5 días naturales.", "En un plazo no superior a 15 días hábiles desde que el cliente presenta la demanda.", "En 30 días naturales.", "En 3 meses administrativos."], "correct": "B", "explanation": "El apartado 4.5 establece preceptivamente: 'Todas las demandas tienen que resolverse y comunicarse a los clientes en un plazo no superior a 15 días hábiles desde que el cliente presenta la demanda'."}, {"id": 119, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Apartado 4.3.1", "question": "Respecto a los requisitos de presentación de 'Sugerencias' (apartado 4.3.1), el procedimiento establece que:", "options": ["Exigen obligatoriamente la identificación con DNI del firmante.", "Se pueden presentar con carácter anónimo, pero deben contener una descripción del contenido esencial.", "Requieren el pago de una tasa de tramitación de calidad.", "Solo las pueden formular empresas concesionarias."], "correct": "B", "explanation": "El apartado 4.3.1 especifica que las sugerencias 'Se pueden presentar con carácter anónimo, pero deben contener una descripción del contenido esencial'."}, {"id": 120, "block": "8. Procedimiento PGQ-043 Calidad", "source": "Procedimiento PGQ-043, Apartado 6.2", "question": "¿Quién es el responsable de documentar la resolución adecuada en el aviso SAP e informar del cierre al cliente por el mismo medio de entrada?", "options": ["El Director General de EMAYA personalmente.", "El Gestor de cada servicio.", "El comité de seguridad y salud.", "El Jefe de Compras y Contratación."], "correct": "B", "explanation": "El apartado 6.2 asigna al Gestor la responsabilidad de 'Documentar la resolución adecuada a la solicitud o queja' e 'Informar al let test = [];
let answers = [];
let current = 0;

function shuffle(a) {
  const arr = [...a];
  for (let i=arr.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function newTest() {
  test = shuffle(BANK).slice(0,30);
  answers = Array(30).fill(null);
  current = 0;
  document.getElementById('test').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');
  render();
}

function render() {
  const q = test[current];
  document.getElementById('counter').textContent = `Pregunta ${current+1} de 30`;
  document.getElementById('answered').textContent = `${answers.filter(x=>x!==null).length} respondidas`;
  document.getElementById('bar').style.width = `${((current+1)/30)*100}%`;
  document.getElementById('badge').textContent = q.block;
  document.getElementById('question').textContent = q.question;

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.options.forEach((text,i)=>{
    const letter = String.fromCharCode(65+i);
    const label = document.createElement('label');
    label.className='option';
    label.innerHTML = `<input type="radio" name="answer" value="${letter}" ${answers[current]===letter?'checked':''}> <b>${letter})</b> ${escapeHtml(text)}`;
    label.querySelector('input').addEventListener('change', e => {
      answers[current]=e.target.value;
      document.getElementById('answered').textContent = `${answers.filter(x=>x!==null).length} respondidas`;
    });
    opts.appendChild(label);
  });

  document.getElementById('prev').disabled = current===0;
  document.getElementById('next').classList.toggle('hidden', current===29);
  document.getElementById('finish').classList.toggle('hidden', current!==29);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function nextQuestion() {
  if(current<29) { current++; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}
function previousQuestion() {
  if(current>0) { current--; render(); window.scrollTo({top:0,behavior:'smooth'}); }
}

function finishTest() {
  let correct=0, wrong=0, blank=0, score=0;
  test.forEach((q,i)=>{
    if(answers[i]===null) blank++;
    else if(answers[i]===q.correct) {correct++; score+=1;}
    else {wrong++; score-=0.3;}
  });
  score=Math.round(score*100)/100;
  const grade=Math.max(0,Math.min(10,score/30*10));
  document.getElementById('test').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('score').textContent = `${score.toFixed(2)} puntos`;
  document.getElementById('score10').innerHTML = `<b>Nota sobre 10: ${grade.toFixed(2)}</b>`;
  document.getElementById('correctCount').textContent=correct;
  document.getElementById('wrongCount').textContent=wrong;
  document.getElementById('blankCount').textContent=blank;

  const review=document.getElementById('review');
  review.innerHTML='<h3>Revisión de respuestas</h3>';
  test.forEach((q,i)=>{
    const ok=answers[i]===q.correct;
    const item=document.createElement('div');
    item.className='review-item '+(ok?'ok':'bad');
    const user = answers[i] ? answers[i] : 'En blanco';
    item.innerHTML = `<div class="review-q">${i+1}. ${escapeHtml(q.question)}</div>
      <div>Tu respuesta: <span class="answer">${escapeHtml(user)}</span></div>
      <div>Respuesta correcta: <span class="answer">${q.correct})</span> ${escapeHtml(q.options[q.correct.charCodeAt(0)-65])}</div>
      <div class="explanation">${escapeHtml(q.explanation)}</div>`;
    review.appendChild(item);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart() { newTest(); window.scrollTo({top:0,behavior:'smooth'}); }
newTest();
</script>
