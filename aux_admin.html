<script>
const bank=[{"n": 1, "q": "Según el artículo 10 del XXVIII Convenio Colectivo de EMAYA, ¿cuál es la duración máxima del periodo de prueba para el personal de los Grupos Profesionales de Titulados Superiores y Medios?", "opts": ["1 mes.", "3 meses.", "6 meses.", "12 meses."], "correct": 2}, {"n": 2, "q": "En el grupo de Auxiliares Administrativos (Grupo Profesional III/IV), ¿cuál es el periodo de prueba fijado en el artículo 10 del Convenio?", "opts": ["15 días.", "1 mes.", "2 meses.", "3 meses."], "correct": 2}, {"n": 3, "q": "Durante el periodo de prueba (Art. 10), ¿qué facultad tienen las partes firmantes del contrato de trabajo?", "opts": ["Despedir con indemnización de 20 días por año.", "Rescindir la relación laboral sin necesidad de preaviso ni derecho a indemnización.", "Solicitar mediación previa ante la Comisión Paritaria.", "Exigir la conversión automática en contrato indefinido."], "correct": 1}, {"n": 4, "q": "¿Computan las situaciones de incapacidad temporal (IT) dentro del periodo de prueba según el artículo 10?", "opts": ["Sí, siempre computan en todo caso.", "No, las situaciones de IT interrumpen el cómputo del periodo de prueba siempre que se acuerde expresamente.", "Depende exclusivamente de la decisión del Comité de Empresa.", "Queda prohibida la IT durante el periodo de prueba."], "correct": 1}, {"n": 5, "q": "De acuerdo con el artículo 11 del Convenio, ¿cuál es la modalidad contractual prioritaria en EMAYA?", "opts": ["Contrato temporal por circunstancias de la producción.", "Contrato indefinido (fijo ordinario o fijo-discontinuo).", "Contrato de formación en alternancia.", "Contrato de puesta a disposición ETT."], "correct": 1}, {"n": 6, "q": "Según el artículo 11, ¿cuándo procede la celebración de un contrato de sustitución?", "opts": ["Para cubrir puestos de trabajo vacantes de forma permanente.", "Para la sustitución de una persona trabajadora con derecho a reserva de puesto de trabajo.", "Para atender picos imprevistos de producción anuales.", "Para realizar tareas de refuerzo estival en playas."], "correct": 1}, {"n": 7, "q": "¿Qué exige el artículo 11 para la cobertura temporal de vacantes durante procesos de selección o promoción?", "opts": ["Un contrato eventual por duración máxima de 3 años.", "Un contrato de sustitución por el tiempo que dure el proceso de selección (máximo legalmente establecido).", "Una encomienda de gestión externa.", "Un convenio de prácticas universitarias."], "correct": 1}, {"n": 8, "q": "Según el artículo 12, el trabajador que desee cesar voluntariamente en la empresa debe preavisar con una antelación mínima de:", "opts": ["7 días naturales.", "15 días naturales.", "30 días naturales.", "60 días naturales."], "correct": 1}, {"n": 9, "q": "¿Qué penalización prevé el artículo 12 si el trabajador incumple total o parcialmente el plazo de preaviso de cese voluntario?", "opts": ["Despido disciplinario inmediato.", "Descuento en la liquidación/finiquito de un día de salario por cada día de preaviso omitido.", "Inhabilitación para trabajar en EMAYA durante 5 años.", "Pérdida del derecho al cobro de las vacaciones devengadas."], "correct": 1}, {"n": 10, "q": "Conforme al artículo 12, la empresa debe entregar al trabajador la propuesta de finiquito con un preaviso de:", "opts": ["3 días.", "7 días.", "15 días (junto con la comunicación del cese cuando proceda).", "30 días."], "correct": 2}, {"n": 11, "q": "Según el artículo 19 del Convenio, ¿cuál es la duración máxima de la jornada anual de trabajo efectivo en EMAYA?", "opts": ["1.500 horas.", "1.582 horas (o la legalmente aplicable según cómputo anual).", "1.720 horas.", "1.800 horas."], "correct": 1}, {"n": 12, "q": "En el artículo 19, ¿cuál es el descanso mínimo entre jornadas consecutivas de trabajo?", "opts": ["8 horas.", "10 horas.", "12 horas.", "14 horas."], "correct": 2}, {"n": 13, "q": "Dentro de la jornada diaria continuada superior a 6 horas, ¿de qué descanso (pausa de bocadillo) se dispone según el artículo 19?", "opts": ["15 minutos no computables como trabajo.", "30 minutos retribuidos y computables como trabajo efectivo.", "45 minutos sin retribución.", "1 hora computable como tiempo libre."], "correct": 1}, {"n": 14, "q": "El descanso semanal mínimo retribuido fijado en el artículo 19 es de:", "opts": ["1 día iminterrumpido.", "1,5 días consecutivos.", "2 días consecutivos de descanso semanal.", "3 días alternos."], "correct": 2}, {"n": 15, "q": "Según el artículo 19, la elaboración de los calendarios laborales anuales debe realizarse previa consulta con:", "opts": ["El Ayuntamiento de Palma de forma exclusiva.", "La representación legal de los trabajadores (Comité de Empresa / Delegados de Personal).", "La Conselleria de Treball.", "El Ministerio de Trabajo."], "correct": 1}, {"n": 16, "q": "Conforme al artículo 21, ¿cuántos días naturales de vacaciones retribuidas le corresponden anualmente al personal de EMAYA?", "opts": ["22 días laborables.", "30 días naturales (o parte proporcional en su caso).", "35 días naturales.", "40 días naturales."], "correct": 1}, {"n": 17, "q": "En caso de matrimonio o registro de pareja de hecho, ¿cuántos días de permiso retribuido concede el artículo 21?", "opts": ["10 días naturales.", "15 días naturales consecutivos.", "20 días laborables.", "1 mes."], "correct": 1}, {"n": 18, "q": "Por fallecimiento de un familiar de primer grado de consanguinidad o afinidad, ¿cuántos días de permiso retribuido establece el artículo 21?", "opts": ["1 día.", "3 días laborables (ampliables si requiere desplazamiento fuera de la isla).", "7 días naturales.", "10 días."], "correct": 1}, {"n": 19, "q": "Según el artículo 21, ¿cuál es el permiso retribuido por traslado del domicilio habitual?", "opts": ["1 día hábil.", "2 días naturales.", "3 días hábiles.", "5 días naturales."], "correct": 0}, {"n": 20, "q": "¿Cuántos días de asuntos propios (días de libre disposición) retribuidos reconoce el artículo 21 del Convenio Colectivo?", "opts": ["3 días al año.", "6 días de libre disposición al año.", "8 días al año.", "10 días al año."], "correct": 1}, {"n": 21, "q": "Según el artículo 21, ¿requiere justificante médico la ausencia para la asistencia a consultas de servicios sanitarios del Servicio de Salud?", "opts": ["No, basta con la palabra del trabajador.", "Sí, por el tiempo estrictamente necesario, aportando el correspondiente volante/justificante de asistencia.", "Solo si supera las 5 horas de duración.", "Solo para especialidades quirúrgicas."], "correct": 1}, {"n": 22, "q": "De acuerdo con el artículo 21, las licencias sin sueldo (licencias no retribuidas) se pueden solicitar por una duración de:", "opts": ["Máximo 3 días al año.", "Mínimo 10 días y máximo 3 meses o según los límites fijados expresamente en el convenio.", "Únicamente para realizar cursos universitarios de grado.", "Sin límite temporal alguno."], "correct": 1}, {"n": 23, "q": "En el artículo 21, los permisos para la realización de exámenes finales o pruebas definitivas de aptitud en centros oficiales son:", "opts": ["No retribuidos y recuperables obligatoriamente.", "Retribuidos por el tiempo necesario para su realización, con previa comunicación y posterior justificación.", "Limitados a 1 examen al año.", "Inexistentes en el sector público empresarial."], "correct": 1}, {"n": 24, "q": "¿Qué exige el artículo 19 con respecto al registro horario diario de la jornada?", "opts": ["Un registro semanal estimativo redactado a mano.", "Un registro diario obligatorio que incluya el horario concreto de inicio y finalización de la jornada.", "El fichaje exclusivo para puestos administrativos.", "La firma trimestral de partes de trabajo."], "correct": 1}, {"n": 25, "q": "Según el artículo 21, ¿cómo se planifican los turnos de vacaciones anuales?", "opts": ["Por orden estricto de antigüedad en la empresa sin rotación.", "De común acuerdo entre empresa y trabajadores, garantizando la cobertura del servicio público y con criterios de rotación anual.", "A libre elección exclusiva de la dirección sin consultar al trabajador.", "Sorteando los turnos cada 5 años."], "correct": 1}, {"n": 26, "q": "¿A quién se aplica el Código Ético y de Conducta de EMAYA?", "opts": ["Únicamente a los miembros del Consejo de Administración.", "A todo el personal de EMAYA, directivos, empleados y colaboradores, independientemente de su puesto o modalidad de contrato.", "Exclusivamente al personal contratado de forma indefinida.", "Solo a las empresas contratistas externas."], "correct": 1}, {"n": 27, "q": "¿Cuál de los siguientes es un principio fundamental recogido en el Código Ético de EMAYA?", "opts": ["Búsqueda del máximo beneficio económico privado.", "Vocación de servicio público, transparencia, integridad y sostenibilidad ambiental.", "Secrecionismo en las contrataciones públicas.", "Priorización de intereses individuales sobre el interés general."], "correct": 1}, {"n": 28, "q": "Respecto a los regalos y atenciones de cortesía, ¿qué regla establece el Código Ético de EMAYA?", "opts": ["Se pueden aceptar cualquier tipo de regalos en metálico.", "Queda prohibido aceptar regalos o favores que puedan influir en la imparcialidad profesional, salvo objetos promocionales o atenciones de cortesía insignificantes.", "Se permite la aceptación de viajes de ocio pagados por proveedores.", "Está permitido recibir comisiones directas de adjudicatarios."], "correct": 1}, {"n": 29, "q": "¿Qué define el Código Ético de EMAYA como un 'conflicto de intereses'?", "opts": ["Una discusión acalorada entre dos compañeros de departamento.", "Cualquier situación en la que el interés personal del empleado interfiera o pueda parecer que interfiere con los intereses de la empresa o el deber público.", "El incumplimiento del horario de trabajo.", "La huelga legal de trabajadores."], "correct": 1}, {"n": 30, "q": "Cuando un empleado se encuentra en una situación de potencial conflicto de intereses, ¿qué debe hacer de inmediato según el Código Ético?", "opts": ["Ocultarlo para no generar desconfianza.", "Comunicarlo por escrito a su superior jerárquico o al Comité de Ética y abstenerse de intervenir.", "Tomar la decisión en beneficio propio.", "Renunciar inmediatamente a su puesto de trabajo."], "correct": 1}, {"n": 31, "q": "En materia de anticorrupción y prevención del delito, ¿cuál es la postura de EMAYA fijada en el Código Ético?", "opts": ["Tolerancia cero ante cualquier forma de corrupción, soborno, fraude o pago de facilitación.", "Permisividad de pagos menores si agilizan trámites administrativos.", "Aceptación de comisiones si se destinan a causas sociales.", "Flexibilidad en adjudicaciones a familiares."], "correct": 0}, {"n": 32, "q": "¿Qué es el Canal Ético de EMAYA previsto en su Código de Conducta?", "opts": ["Un foro de debate interno sobre mejoras salariales.", "Un cauce confidencial para comunicar o denunciar posibles irregularidades, incumplimientos éticos o actos ilícitos en la empresa.", "Un buzón público de sugerencias comerciales.", "Un número de teléfono para solicitar cita previa de residuos."], "correct": 1}, {"n": 33, "q": "¿Qué garantía fundamental ofrece EMAYA a las personas que comuniquen una irregularidad de buena fe a través del Canal Ético?", "opts": ["Gratificación económica equivalente a una extra.", "Garantía de confidencialidad y prohibición absoluta de represalias o consecuencias adversas.", "Amonestación verbal por injerencia.", "Traslado obligatorio de centro de trabajo."], "correct": 1}, {"n": 34, "q": "En relación con el uso de los recursos informáticos y activos de la empresa, el Código Ético establece que:", "opts": ["Deben utilizarse exclusivamente de forma profesional y eficiente para los fines de la empresa, respetando las normas de ciberseguridad.", "Pueden usarse libremente para actividades lucrativas personales fuera de horario.", "Está permitido instalar software no autorizado o pirata.", "Se pueden compartir las contraseñas con usuarios externos."], "correct": 0}, {"n": 35, "q": "¿Cómo debe tratarse la información confidencial y los datos de carácter personal en EMAYA según el Código Ético?", "opts": ["Con absoluta reserva, utilizándolos únicamente para las funciones encomendadas y cumpliendo la normativa de protección de datos (RGPD).", "Publicándolos en redes sociales para dar transparencia.", "Vendiéndolos a terceros proveedores con fines estadísticos.", "Eliminándolos sin archivo ni custodia."], "correct": 0}, {"n": 36, "q": "En las relaciones con empresas proveedoras y contratistas, el Código Ético exige:", "opts": ["Favorecer a proveedores locales sin concurso público.", "Objetividad, imparcialidad, concurrencia y trato equitativo en los procesos de selección y contratación.", "Aceptar descuentos privados para empleados.", "Exigir pagos a fondo perdido a los adjudicatarios."], "correct": 1}, {"n": 37, "q": "Respecto a la salud y seguridad laboral, el Código Ético de EMAYA compromete a la empresa a:", "opts": ["Proporcionar un entorno de trabajo seguro y saludable, promoviendo la prevención de riesgos y el bienestar integral.", "Trasladar toda la responsabilidad preventiva a los contratistas.", "Considerar la seguridad como un coste prescindible.", "Realizar revisiones médicas solo cuando lo solicite un juez."], "correct": 0}, {"n": 38, "q": "¿Qué compromiso asume EMAYA en su Código Ético respecto a la igualdad de oportunidades y no discriminación?", "opts": ["Priorizar la contratación de un solo género.", "Garantizar un trato justo, equitativo e igualitario, rechazando cualquier discriminación por razón de sexo, raza, religión, orientación sexual o discapacidad.", "Permitir comentarios vejatorios si no hay testigos.", "Segregar puestos según la edad."], "correct": 1}, {"n": 39, "q": "En el ámbito medioambiental, el Código Ético de EMAYA obliga a todos sus empleados a:", "opts": ["Minimizar el impacto ambiental de sus actividades, haciendo un uso eficiente de los recursos naturales y promoviendo el reciclaje.", "Vertir residuos libremente si no están catalogados.", "Ignorar las incidencias ambientales detectadas.", "Aumentar el consumo de papel impreso sin justificación."], "correct": 0}, {"n": 40, "q": "¿Qué ocurre si un empleado realiza una denuncia falsa o a sabiendas maliciosa en el Canal Ético?", "opts": ["Recibe un premio a la participación.", "Podrá ser objeto de medidas disciplinarias según la gravedad de los hechos, al vulnerar el principio de buena fe.", "Se le garantiza impunidad absoluta.", "Se remite el expediente al Defensor del Pueblo."], "correct": 1}, {"n": 41, "q": "¿Cuál es el papel del Comité de Ética o del Órgano de Cumplimiento Normativo en EMAYA?", "opts": ["Supervisar el funcionamiento del Código Ético, tramitar las denuncias del Canal Ético y promover la formación en integridad.", "Aprobar el presupuesto financiero anual de la ciudad.", "Representar legalmente a los sindicatos.", "Sancionar directamente sin expediente previo."], "correct": 0}, {"n": 42, "q": "Respecto a la participación en actividades políticas o públicas personales por parte del personal de EMAYA, el Código establece que:", "opts": ["Queda totalmente prohibida la afiliación política.", "Debe desarrollarse a título exclusivamente personal, fuera del horario laboral y sin utilizar recursos ni el nombre de la empresa.", "EMAYA financia las candidaturas de sus trabajadores.", "Es obligatorio hacer propaganda en las oficinas de atención."], "correct": 1}, {"n": 43, "q": "En caso de dudas sobre la interpretación del Código Ético, el empleado debe dirigirse a:", "opts": ["Los foros informáticos anónimos.", "Su superior jerárquico o al buzón de consultas del Comité de Ética.", "La prensa local.", "La empresa de auditoría externa."], "correct": 1}, {"n": 44, "q": "El cumplimiento de las normas del Código Ético de EMAYA se considera:", "opts": ["Una mera recomendación voluntaria sin efectos jurídicos.", "Un deber contractual obligatorio cuya infracción constituye un incumplimiento laboral disciplinable.", "Un trámite exclusivo para la fase de formación inicial.", "Una norma aplicable solo durante inspecciones externas."], "correct": 1}, {"n": 45, "q": "Respecto a las redes sociales y la imagen corporativa, el Código Ético aconseja a los empleados:", "opts": ["Actuar con prudencia y respeto, evitando difundir información reservada o que menoscabe el prestigio de la empresa o de los usuarios.", "Publicar fotos de instalaciones internas restringidas.", "Criticar anónimamente a los usuarios en foros públicos.", "Utilizar los perfiles oficiales de EMAYA para opiniones personales."], "correct": 0}, {"n": 46, "q": "¿Qué compromiso asume EMAYA en materia de calidad del servicio prestado a la ciudadanía?", "opts": ["Prestar un servicio eficiente, accesible, continuo y orientado a la satisfacción y resolución de las necesidades ciudadanas.", "Atender solo las peticiones con importe superior a 100 euros.", "Derivar todas las consultas presenciales a la web.", "Limitar la atención al público a 1 hora semanal."], "correct": 0}, {"n": 47, "q": "¿Está permitido el consumo de alcohol o sustancias estupefacientes durante el desempeño de la jornada laboral en EMAYA?", "opts": ["Sí, en festividades locales.", "No, queda prohibido el consumo o estar bajo sus efectos, al poner en riesgo la seguridad propia, de compañeros y de la ciudadanía.", "Solo durante los turnos de noche.", "Solo con autorización previa del encargado."], "correct": 1}, {"n": 48, "q": "En el ámbito contable y financiero, el Código Ético de EMAYA exige:", "opts": ["Registrar con exactitud, veracidad y transparencia todas las transacciones financieras en los libros contables.", "Crear cajas negras para gastos Imprevistos.", "Ocultar facturas no abonadas a final de año.", "Aproximar las cifras al millón más cercano."], "correct": 0}, {"n": 49, "q": "¿Cómo define el Código Ético el concepto de 'acoso en el trabajo' (laboral o sexual)?", "opts": ["Una conducta no deseada que atenta contra la dignidad de la persona y crea un entorno intimidatorio, hostil o humillante, siendo inaceptable.", "Una discrepancia profesional sobre el reparto de vacaciones.", "La exigencia de cumplimiento del horario de trabajo.", "La evaluación periódica del desempeño."], "correct": 0}, {"n": 50, "q": "La difusión y formación periódica sobre el Código Ético de EMAYA es responsabilidad de:", "opts": ["Los propios empleados de forma autodidacta.", "La Dirección de la empresa y la Unidad de Cumplimiento/Recursos Humanos.", "El Ministerio de Hacienda.", "Los sindicatos de forma exclusiva."], "correct": 1}, {"n": 51, "q": "Según el artículo 14 de la Ley 31/1995 de PRL, ¿en quién recae el deber de protección de los trabajadores frente a los riesgos laborales?", "opts": ["En los propios trabajadores de forma exclusiva.", "En el empresario, que debe garantizar la seguridad y la salud del personal a su servicio en todos los aspectos relacionados con el trabajo.", "En la Inspección de Trabajo.", "En las Muestras de Salud de la Seguridad Social."], "correct": 1}, {"n": 52, "q": "A tenor del artículo 14.5 de la Ley de PRL, ¿pueden recaer sobre los trabajadores los costes de las medidas relativas a la seguridad y salud en el trabajo?", "opts": ["Sí, compartiendo el 50% del coste con la empresa.", "En ningún caso el coste de las medidas de seguridad y salud podrá recaer sobre los trabajadores.", "Solo en el caso de los Equipos de Protección Individual (EPI).", "Únicamente si se superan las horas extraordinarias."], "correct": 1}, {"n": 53, "q": "¿Cuál es el primer principio de la acción preventiva enunciado en el artículo 15.1.a) de la Ley 31/1995?", "opts": ["Evaluar los riesgos inevitables.", "Evitar los riesgos.", "Sustituir lo peligroso por lo que entrañe poco o ningún peligro.", "Dar las debidas instrucciones a los trabajadores."], "correct": 1}, {"n": 54, "q": "Según el artículo 15.1.h), al planificar la prevención de riesgos laborales debe anteponerse la protección:", "opts": ["Individual sobre la colectiva.", "Colectiva a la individual.", "Económica sobre la técnica.", "Temporal sobre la permanente."], "correct": 1}, {"n": 55, "q": "El artículo 15.1.c) mandata que en la gestión preventiva se debe:", "opts": ["Combatir los riesgos en su origen.", "Aceptar los riesgos inevitables sin intervenir.", "Comprar los EPIs más baratos.", "Esperar a la ocurrencia del accidente para actuar."], "correct": 0}, {"n": 56, "q": "Conforme al artículo 15.1.d), el principio de 'adaptar el trabajo a la persona' se refiere especialmente a:", "opts": ["Aumentar la producción sin pausas.", "La concepción de los puestos de trabajo, la elección de equipos y los métodos de trabajo y producción.", "Ajustar los salarios a la condición física.", "Fijar turnos de 12 horas."], "correct": 1}, {"n": 57, "q": "Según el artículo 16.1 de la Ley 31/1995, la prevención de riesgos laborales debe integrarse en el sistema general de gestión de la empresa a través de:", "opts": ["Un seguro privado de accidentes.", "Un Plan de Prevención de Riesgos Laborales.", "Un informe semestral del Comité de Empresa.", "Una reunión anual de la plantilla."], "correct": 1}, {"n": 58, "q": "¿Qué instrumentos esenciales integran el Plan de Prevención según el artículo 16.2?", "opts": ["La memoria económica y el balance contable.", "La evaluación de riesgos laborales y la planificación de la actividad preventiva.", "El reglamento disciplinario y el horario de trabajo.", "El catálogo de sanciones y las nóminas."], "correct": 1}, {"n": 59, "q": "Según el artículo 16.2.a), la evaluación inicial de riesgos deberá actualizarse cuando:", "opts": ["Cambien las condiciones de trabajo o se introduzcan nuevos equipos, tecnologías o sustancias.", "Lo decida un trabajador de forma unilateral.", "Transcurran exactamente 10 años sin cambios.", "Se renueve la junta directiva de la empresa."], "correct": 0}, {"n": 60, "q": "¿Cuándo debe el empresario realizar una investigación de los hechos según el artículo 16.3?", "opts": ["Cuando se haya producido un daño pa ": 65, "q": "A tenor del artículo 18.2, los trabajadores tienen derecho a efectuar propuestas al empresario dirigidas a:", "opts": ["La fijación del precio de los servicios públicos.", "La mejora de los niveles de protección de la seguridad y la salud en la empresa.", "La reducción de las aportaciones a la Seguridad Social.", "El cambio de domicilio social de la entidad."], "correct": 1}, {"n": 66, "q": "Según el artículo 19.1 de la Ley 31/1995, la formación en materia preventiva debe ser:", "opts": ["Únicamente teórica y leída en folletos.", "Suficiente y adecuada, tanto teórica como práctica, centrada en el puesto de trabajo o función específica.", "Genérica e idéntica para todos los sectores profesionales.", "Opcional y abonada por el empleado."], "correct": 1}, {"n": 67, "q": "¿En qué momentos debe impartirse la formación en PRL según el artículo 19.1?", "opts": ["Únicamente al jubilarse el trabajador.", "En el momento de la contratación, y cuando se produzcan cambios en las funciones o en las tecnologías/equipos de trabajo.", "Exclusivamente tras sufrir un accidente grave.", "Cada 15 años de forma fija."], "correct": 1}, {"n": 68, "q": "De acuerdo con el artículo 19.2, la formación en materia preventiva se impartirá:", "opts": ["Siempre fuera de la jornada laboral sin compensación.", "Dentro de la jornada de trabajo o, en su defecto, en otras horas pero con el descuento en aquélla del tiempo invertido en la misma.", "A cuenta del descanso semanal del trabajador.", "En periodos de vacaciones."], "correct": 1}, {"n": 69, "q": "¿Quién debe asumir la financiación de la formación en PRL según el artículo 19.2?", "opts": ["El trabajador mediante deducción en nómina.", "El empresario, no pudiendo recaer su coste en ningún caso sobre los trabajadores.", "Los sindicatos de forma exclusiva.", "La Mutua Colaboradora con cargo al trabajador."], "correct": 1}, {"n": 70, "q": "En el artículo 14.2, el deber de prevención del empresario incluye la obligación de:", "opts": ["Ga eves y graves.", "Leves, Graves y Muy Graves.", "Civiles, Administrativas y Penales.", "De primer grado y de segundo grado."], "correct": 1}, {"n": 111, "q": "Según el artículo 53, constituye una infracción LEVE en materia de limpieza:", "opts": ["El vertido industrial de sustancias tóxicas en acuíferos.", "Arrojar colillas, papeles o pequeños envoltorios a la vía pública fuera de las papeleras, o no recoger excrementos caninos puntual.", "Derribar un contenedor para quemarlo.", "Agredir a los inspectores de limpieza."], "correct": 1}, {"n": 112, "q": "El artículo 54 tipifica como infracción GRAVE:", "opts": ["El abandono de muebles y voluminosos fuera del día o procedimiento autorizado, o la realización de pintadas/grafitis en la vía pública.", "Tirar un chicle al suelo.", "Sacudir una servilleta de papel.", "Llevar un perro con correa."], "correct": 0}, {"n": 113, "q": "Conforme al artículo 55, se considera una infracción MUY GRAVE:", "opts": ["Tirar un billete de autobús en la acera.", "El vertido incontrolado de residuos peligrosos, tóxicos o inflamables, o la quema intencionada de contenedores urbanos.", "Dejar la tapa de un contenedor abierta.", "Sacar la basura a las 19:30 en lugar de las 20:00."], "correct": 1}, {"n": 114, "q": "De acuerdo con el artículo 56, las sanciones pecuniarias (multas) para las infracciones LEVES pueden alcanzar hasta un máximo de:", "opts": ["100 euros.", "300 euros (o hasta 750 € según la escala sancionadora municipal vigente).", "1.500 euros.", "3.000 euros."], "correct": 1}, {"n": 115, "q": "Según el artículo 57, la cuantía máxima de la sanción para infracciones GRAVES en la Ordenanza oscila hasta:", "opts": ["500 euros.", "1.500 euros.", "3.000 euros.", "6.000 euros."], "correct": 1}, {"n": 116, "q": "El artículo 58 prevé que para las infracciones MUY GRAVES, las multas pueden alcanzar un importe de hasta:", "opts": ["1.500 euros.", "3.000 euros (o superiores según la Ley estatal de Residuos aplicable).", "10.000 euros.", "50.000 euros."], "correct": 1}, {"n": 117, "q": "A tenor del artículo 59, la imposición de las sanciones administrativas contempladas en la Ordenanza es compatible con:", "opts": ["La exención de reparar el daño causado.", "La obligación del infractor de reparar el daño producido o reponer los bienes lesionados a su estado originario.", "Un premio concedido por el Ayuntamiento.", "La condonar automática si se pide perdón verbalmente."], "correct": 1}, {"n": 118, "q": "Según el artículo 60, en los supuestos en que la infracción sea cometida por un menor de edad, responderán solidariamente del pago de la sanción:", "opts": ["Los profesores de su colegio.", "Sus padres, tutores o guardadores legales.", "El Director General de EMAYA.", "El menor exclusivamente cuando trabaje."], "correct": 1}, {"n": 119, "q": "El artículo 61 atribuye la competencia para la instrucción e imposición de las sanciones administrativas a:", "opts": ["El Tribunal Superior de Justicia de Baleares.", "La Alcaldía o el órgano municipal/Consejo de Administración en quien delegue expresamente (Servicio Sancionador Municipal).", "La Guardia Civil de Tráfico.", "El Defensor de la Ciudadanía."], "correct": 1}, {"n": 120, "q": "A tenor del artículo 14, lavar vehículos en la vía pública utilizando agua o jabón de forma que se ensucie la acera:", "opts": ["Está permitido los domingos por la mañana.", "Queda expresamente prohibido en las calles y espacios públicos no autorizados.", "Se autoriza si se usa esponja.", "Requiere solo permiso de la comunidad."], "correct": 1}, {"n": 121, "q": "Según el artículo 30, la pegada de carteles comerciales en farolas, marquesinas o mobiliario urbano con lleva:", "opts": ["La retirada obligatoria a costa del anunciante además de la multa correspondiente.", "Un descuento en la tasa de basura.", "Su conversión en publicidad institucional.", "Ninguna consecuencia."], "correct": 0}, {"n": 122, "q": "Conforme al artículo 33, en las zonas donde exista sistema de recogida Puerta a Puerta (PaP) comercial o residencial, los residuos deben sacarse:", "opts": ["Cualquier día a cualquier hora.", "En los días, horas y condiciones fijadas específicamente para cada fracción en el calendario del servicio PaP.", "Exclusivamente en cajas de madera.", "Dejándolos en el tejado."], "correct": 1}, {"n": 123, "q": "De acuerdo con el artículo 44, ¿cuántos voluminosos o muebles por aviso se pueden entregar como máximo en el servicio gratuito de recogida domiciliaria previa cita?", "opts": ["1 solo objeto pequeño.", "El límite fijado por EMAYA en la cita previa (habitualmente hasta un máximo de 3 a 5 bultos por solicitud).", "Una mudanza completa de 50 cajas.", "Sin límite alguno."], "correct": 1}, {"n": 124, "q": "A tenor del artículo 49, las bolsas que contengan excrementos caninos recogidos de la acera se pueden depositar en:", "opts": ["Únicamente en el contenedor marrón de orgánica.", "Papeleras públicas, contenedores de la fracción rechazo/resto o contenedor habilitado al efecto.", "El alcantarillado directo.", "En los buzones de correos."], "correct": 1}, {"n": 125, "q": "Según el artículo 53, la no limpieza inmediata de la mancha producida en la acera por el arrastre de bolsas de basura por parte de un vecino constituye una infracción:", "opts": ["Muy Grave.", "Grave.", "Leve.", "Penal."], "correct": 2}, {"n": 126, "q": "¿Cuál es el primer escalón prioritario en la jerarquía europea de gestión de residuos aplicada por EMAYA?", "opts": ["La incineración con recuperación de energía.", "La prevención (reducción en la generación de residuos).", "El vertido controlado en depósitos.", "El reciclaje químico."], "correct": 1}, {"n": 127, "q": "¿Qué tipo de residuos deben depositarse de forma exclusiva en el CONTENEDOR MARRÓN en Palma?", "opts": ["Plásticos duros, persianas y juguetes de bebé.", "Materia orgánica compostable (restos de comida, cáscaras de fruta, posos de café, servilletas de papel usadas con restos orgánicos).", "Botes de pintura y disolventes.", "Restos de cristal de ventanas rotas."], "correct": 1}, {"n": 128, "q": "En el CONTENEDOR AMARILLO se deben depositar únicamente:", "opts": ["Envases ligeros de plástico, latas, briks, tapas metálicas y bandejas de porexpan.", "Sartenes viejas, bombillas y cables eléctricos.", "Papel de periódico y revistas.", "Botellas y tarros de vidrio."], "correct": 0}, {"n": 129, "q": "¿Cuál de los siguientes objetos constituye un 'impropio' y NO debe tirarse NUNCA al contenedor AMARILLO?", "opts": ["Una botella de plástico de agua.", "Un bote de champú vacío.", "Un juguete de plástico roto o un cubo de fregona de plástico duro (no envases).", "Una lata de refresco."], "correct": 2}, {"n": 130, "q": "El CONTENEDOR AZUL está destinado a la recogida selectiva de:", "opts": ["Papel, cartón, cajas de cartón desplegadas, periódicos, revistas y bolsas de papel.", "Pañales usados y compresas.", "Fotografías en papel fotográfico con químicos.", "Cajas de madera de fruta."], "correct": 0}, {"n": 131, "q": "¿Por qué motivo las cajas de pizza con abundantes restos de grasa o queso quemado NO deben depositarse en el contenedor azul?", "opts": ["Porque el cartón graso arruina el proceso de reciclado del papel, debiendo ir a la fracción resto o materia orgánica si es compostable.", "Porque atraen a las gaviotas en la planta.", "Porque el contenedor azul solo admite papel blanco de impresora.", "Porque es obligatorio guardarlas en casa."], "correct": 0}, {"n": 132, "q": "En el CONTENEDOR VERDE (iglú verde) se debe depositar exclusivamente:", "opts": ["Botellas, frascos y tarros de vidrio (sin tapas ni tapones).", "Espejos, cristales de ventanas, vajillas de cerámica y vasos de cristal de duralex.", "Bombillas fluorescentes.", "Termómetros de mercurio antiguos."], "correct": 0}, {"n": 133, "q": "¿Cuál es la diferencia fundamental entre el 'vidrio' de botella y el 'cristal' de copa o ventana?", "opts": ["No existe ninguna diferencia.", "El cristal contiene óxido de plomo u otros componentes uclear.", "La producción de compost de alta calidad para la agricultura/jardinería y la generación de biogas/energía renovable.", "La fabricación de botellas de plástico de refresco.", "Evitar la lluvia ácida en verano."], "correct": 1}, {"n": 144, "q": "¿Qué es la tasa de rechazo o fracción 'impropia' en un contenedor de recogida selectiva?", "opts": ["El porcentaje de residuos equivocados o mal clasificados introducidos en un contenedor que no corresponde.", "El importe que cobra el Ayuntamiento por retraso en el pago.", "El peso de la pintura del camión de recogida.", "El número de bolsas rotas en la acera."], "correct": 0}, {"n": 145, "q": "En la gestión de residuos de Palma, ¿qué sistema se utiliza prioritariamente para el tratamiento de la fracción rechazo (gris)?", "opts": ["El vertido directo en el mar.", "La valorización energética (incineración con generación de energía eléctrica en Son Reus) evitando el vertedero.", "Su entierro en parques públicos.", "Su exportación en barcos a otros países."], "correct": 1}, {"n": 146, "q": "¿Cuál es el horario habitual de servicio de recogida de los Punts Verds fijos de Palma (Sant Jordi, Son Castelló)?", "opts": ["24 horas seguidas los 365 días del año.", "Horario continuado de lunes a domingo de mañana y tarde facilitando el depósito ciudadano.", "Solo los martes de 10:00 a 11:00 de la mañana.", "Abren únicamente los días de lluvia."], "correct": 1}, {"n": 147, "q": "¿Pueden las empresas o comercios depositar grandes cantidades de residuos industriales peligrosos en los Punts Verds municipales ordinarios?", "opts": ["Sí, de forma ilimitada y gratuita.", "No, los Punts Verds son para residuos domésticos o asimilables en cantidades limitadas; las empresas deben contratar gestores autorizados.", "Solo si pagan en efectivo al operario del Punt Verd.", "Sí, si los entregan de noche."], "correct": 1}, {"n": 148, "q": "En el contenedor de MATERIA ORGÁNICA (marrón), ¿se deben utilizar bolsas de plástico convencionales de supermercado?", "opts": ["Sí, da exactamente igual el tipo de bolsa.", "No, se exige el uso prioritario de bolsas compostables de fécula de vegetal para no contaminar el proceso de compostaje.", "Solo bolsas de papel de aluminio.", "Está prohibido usar cualquier tipo de bolsa."], "correct": 1}, {"n": 149, "q": "¿Qué tratamiento reciben las latas de aluminio y acero recogidas en el contenedor amarillo?", "opts": ["Se trituran y funden para fabricar nuevos productos metálicos con un ahorro energético del 90% respecto al mineral virgen.", "Se entierran en pozos de carbón.", "Se convierten en compost de jardín.", "Se transforman en vidrio transparente."], "correct": 0}, {"n": 150, "q": "En la recogida de cartón comercial en Palma, ¿qué sanción o consecuencia conlleva el incumplimiento reiterado del horario del PaP comercial?", "opts": ["La retirada de la licencia de apertura inmediatamente.", "Apertura de expediente sancionador según la Ordenanza Municipal de Limpieza.", "El aumento del impuesto sobre la renta.", "Ninguna, es voluntario."], "correct": 1}, {"n": 151, "q": "¿Qué tipo de residuos se recogen en las campañas especiales de recogida de poda estacional en zonas residenciales de Palma?", "opts": ["Ramas, cesped y restos vegetales de jardinería atados en haces o en sacos autorizados.", "Troncos de árboles de más de 2 metros de diámetro.", "Muebles de jardín de plástico.", "Tierra de obra y escombros."], "correct": 0}, {"n": 152, "q": "Los neumáticos fuera de uso (NFU) generados en talleres particulares o talleres mecánicos deben gestionarse mediante:", "opts": ["Su depósito en el contenedor amarillo.", "Sistemas Integrados de Gestión (SIGNUS / Tratamiento Neumáticos) a través de gestores autorizados o Punts Verds en cupo doméstico.", "Su abandono en cunetas de carreteras.", "Su quema en hogueras de San Juan."], "correct": 1}, {"n": 153, "q": "¿Qué elemento de un envase de vidrio verde NO debe introducirse en el contenedor iglú verde?", "opts": ["El cuerpo de la botella de vino de vidrio.", "Los tapones de corcho, las chapas metálicas o las tapas de rosca de plástico/metal.", "El frasco de perfume de vidrio.", "El tarro de mermelada de vidrio."], "correct": 1}, {"n": 154, "q": "¿Cuál de los siguientes materiales SÍ se puede reciclar en el contenedor AZUL de papel/cartón?", "opts": ["Folletos publicitarios, cuadernos sin espiral metálica, sobres de cartas sin ventanilla plastificada.", "Papel térmico de tickets de compra de supermercado.", "Papel de calco o papel carbón.", "Pañales y servilletas de papel usadas con restos de comida."], "correct": 0}, {"n": 155, "q": "Los tickets de compra de papel térmico (tickets de caja) NO van al contenedor azul porque:", "opts": ["Contienen bisfenol A (BPA) o sustancias químicas térmicas no reciclables con la pulpa de papel ordinario, debiendo ir a la fracción resto.", "Tienen un tamaño demasiado grande.", "Están escritos en español.", "Son propiedad del Estado."], "correct": 0}, {"n": 156, "q": "En el sistema de recogida selectiva en Palma, ¿qué es un 'Ecopunto' o 'Punto Limpio de Barrio'?", "opts": ["Contenedores soterrados o de superficie agrupados en las calles para facilitar la separación de las 5 fracciones en un mismo punto.", "Un supermercado ecológico.", "Una oficina de pago de multas.", "Un depósito de agua potable."], "correct": 0}, {"n": 157, "q": "¿Qué tipo de residuos se aceptan en el Punt Verd para pequeños escombros de obras particulares de viviendas?", "opts": ["Restos de azulejos, baldosas, yeso o cemento procedente de pequeñas reformas en sacos, hasta un peso/volumen máximo por día.", "Estructuras enteras de hormigón armado de edificios derribados.", "Residuos con amianto o uralita sin sellar.", "Tuberías de plomo con residuos químicos industriales."], "correct": 0}, {"n": 158, "q": "¿Cómo debe actuar un ciudadano si encuentra un contenedor de recogida selectiva desbordado o dañado en su calle?", "opts": ["Quemar el contenedor para llamar la atención.", "Comunicar la incidencia a EMAYA a través del teléfono de atención, la app municipal o la web de incidencias para su sustitución o vaciado urgente.", "Tirar la basura al suelo de la acera.", "Mover el contenedor a medio de la calzada de tráfico."], "correct": 1}, {"n": 159, "q": "¿Qué tratamiento reciben los aceites vegetales usados recogidos en Palma?", "opts": ["Se refinan y procesan para la fabricación de biocarburantes (biodiésel) reductores de emisiones contaminantes.", "Se vierten a los ríos de la isla.", "Se emplean para fabricar refrescos.", "Se queman en incineradoras sin filtro."], "correct": 0}, {"n": 160, "q": "¿Qué norma rige el vertido de radiografías médicas antiguas fuera de uso?", "opts": ["Tirarlas al contenedor azul.", "Llevarlas a las Punts Verds o farmacias adheridas para la recuperación de las sales de plata que contienen.", "Quemarlas en casa.", "Entregarlas en el contenedor amarillo."], "correct": 1}, {"n": 161, "q": "Los envases de aerosoles o sprays vacíos de desodorante o laca (de metal o aluminio) van al contenedor:", "opts": ["Gris de rechazo.", "Amarillo de envases.", "Verde de vidrio.", "Azul de papel."], "correct": 1}, {"n": 162, "q": "¿Se pueden tirar fluorescentes o bombillas de bajo consumo en el contenedor verde de vidrio?", "opts": ["Sí, todo el vidrio va al mismo sitio.", "No, contienen vapor de mercurio y materiales pesados, debiendo llevarse obligatoriamente al Punt Verd o contenedor Ambilamp.", "Sí, si se rompen antes.", "Solo las de color blanco."], "correct": 1}, {"n": 163, "q": "¿Qué es la economía circular promocionada en las guías de residuos de Palma?", "opts": ["Un modelo de producción y consumo que implica compartir, alquilar, reutilizar, reparar, renovar y reciclar materiales existentes todas las veces posibles.", "Comprar productos de un solo uso y tirarlos inmediatamente.", "Pagar impuestos en monedas circulares.", "Utilizar camiones de basura redondos."], "correct": 0}, {"n": 164, "q": "En el contenedor MARRÓN de orgánica, ¿se pueden depositar tapones de corcho natural?", "opts": ["Sí, al ser madera/materia orgánica natural compostable.", "No, deben ir al contenedor amarillo.", "No, van al contenedor verde.", "Está totalmente prohibido introducirlos."], "correct": 0}, {"n": 165, "q": "¿Qué residuo de origen animal NO debe depositarse en el contenedor marrón si es de origen veterinario o sanitario?", "opts": ["Restos de carne o hueso cocinado de comida.", "Cadáveres de animales o residuos infecciosos veterinarios.", "Espinas de pescado.", "Cáscaras de huevo."], "correct": 1}, {"n": 166, "q": "Las perchas de plástico para colgar ropa compradas sueltas deben depositarse en:", "opts": ["El contenedor amarillo.", "El Punt Verd o contenedor de resto/rechazo (al no ser un envase comercial de producto).", "El contenedor azul.", "El iglú verde."], "correct": 1}, {"n": 167, "q": "¿Qué son los residuos voluminosos según las guías de Palma?", "opts": ["Aquellos residuos domésticos que por su tamaño, peso o forma no pueden ser introducidos en los contenedores habituales de calle (muebles, colchones, somieres).", "Las bolsas de basura llenas de papel de periódico.", "Las botellas de plástico de 5 litros.", "Los coches abandonados en la vía pública."], "correct": 0}, {"n": 168, "q": "¿Cuál es la penalización ambiental de arrojar toallitas húmedas al inodoro?", "opts": ["Ninguna, se disuelven como el papel higiénico.", "Provocan atascamientos gigantescos (monstruo de las cloacas) en la red de alcantarillado y estaciones depuradoras de Palma, debiendo ir siempre a la papelera/resto.", "Aumentan el caudal de agua potable.", "Son excelentes para el compostaje."], "correct": 1}, {"n": 169, "q": "¿Cómo deben entregarse los residuos de briks (leche, zumos) en el contenedor amarillo?", "opts": ["Llenos de líquido hasta arriba.", "Escurridos, vacíos y preferentemente aplastados para optimizar el volumen dentro del contenedor.", "Cortados en tiras microscópicas.", "Congelados."], "correct": 1}, {"n": 170, "q": "¿Dónde se deben depositar las cápsulas de café usadas de aluminio o plástico?", "opts": ["En el contenedor marrón obligatoriamente.", "En los puntos de recogida de cápsulas habilitados en tiendas/Punts Verds o en la fracción indicada por el fabricante/resto.", "En el contenedor azul de papel.", "En el alcantarillado público."], "correct": 1}, {"n": 171, "q": "El papel de aluminio para envolver alimentos, una vez usado y limpio, debe ir al contenedor:", "opts": ["Azul.", "Amarillo.", "Verde.", "Marrón."], "correct": 1}, {"n": 172, "q": "¿Pueden depositarse platos de loza rotos en el contenedor de vidrio verde?", "opts": ["Sí, la loza se recicla igual que la botella de cerveza.", "No, la loza es cerámica (material cerámico) y contamina la masa de reciclado de vidrio; va al Punt Verd o rechazo.", "Sí, si se tritura en trozos pequeños.", "Solo los platos de color verde."], "correct": 1}, {"n": 173, "q": "¿Qué ventajas aporta la utilización del servicio del 'Punt Verd Mòbil' a las personas mayores o con movilidad reducida?", "opts": ["Permite reciclar residuos especiales sin tener que desplazarse a los polígonos industriales donde están los Punts Verds fijos.", "Les regala la compra semanal.", "Les paga el recibo de la luz.", "Les limpia la vivienda por dentro."], "correct": 0}, {"n": 174, "q": "¿Qué destino tienen los restos de poda triturados recogidos selectivamente en Palma?", "opts": ["Se utilizan como estructurante en la planta de compostaje para mezclarlos con la materia orgánica o para mantillo de jardines.", "Se vierten a las playas para crear sombra.", "Se transforman en papel fotográfico.", "Se incineran directamente sin tratar."], "correct": 0}, {"n": 175, "q": "El principio de 'quien contamina paga' en la normativa europea de residuos busca:", "opts": ["Que los costes de gestión y restauración ambiental recaigan en los productores y poseedores que generan el residuo.", "Cobrar impuestos solo a las personas sin vehículo.", "Subvencionar el vertido incontrolado.", "Que los costes los asuma siempre el estado sin exigir responsabilidad."], "correct": 0}, {"n": 176, "q": "¿Cuál es el objeto principal del Procedimiento de Gestión de Calidad PGQ-043 de EMAYA?", "opts": ["Aprobar el reglamento disciplinario de plantilla.", "Establecer la metodología para la recogida, tramitación, resolución, respuesta y análisis de las solicitudes de información, quejas, sugerencias y avisos de la ciudadanía.", "Fijar las tarifas del suministro de agua potable.", "Regular las compras a proveedores internacionales."], "correct": 1}, {"n": 177, "q": "Según el procedimiento PGQ-043, ¿cómo se define formalmente una 'QUEJA'?", "opts": ["Una propuesta de mejora sobre el funcionamiento del servicio.", "La manifestación de insatisfacción o descontento de un usuario por la prestación de un servicio, atención recibida o incumplimiento de compromisos.", "Un aviso de avería de agua urgente.", "La petición de un certificado de pago."], "correct": 1}, {"n": 178, "q": "En el PGQ-043, ¿qué diferencia a un 'AVISO / PETICIÓN DE SERVICIO' de una queja?", "opts": ["El aviso es la comunicación de un hecho o incidencia operativa (ej. fuga de agua, contenedor lleno) para que la empresa intervenga de forma correctora.", "El aviso exige siempre una indemnización económica.", "El aviso solo se puede presentar por escrito judicial.", "No existe diferencia alguna."], "correct": 0}, {"n": 179, "q": "¿Cómo define el PGQ-043 el concepto de 'SUGERENCIA'?", "opts": ["Una reclamación de daños a vehículos.", "Cualquier propuesta aportada por la ciudadanía orientada a mejorar la calidad, eficiencia o funcionamiento de los servicios prestados por EMAYA.", "Una solicitud de subvención comercial.", "Un recurso de alzada ante el Juez."], "correct": 1}, {"n": 180, "q": "De acuerdo con el PGQ-043, ¿cuál es el PLAZO MÁXIMO OFICIAL de respuesta/resolución comunicada al usuario para quejas y solicitudes?", "opts": ["5 días naturales.", "15 días hábiles (o los establecidos en la Carta de Servicios).", "30 días naturales.", "3 meses."], "correct": 1}, {"n": 181, "q": "¿Cuáles de los siguientes son CANALES DE ENTRADA válidos para la presentación de quejas o sugerencias según el PGQ-043?", "opts": ["Atención presencial en oficinas, Registro General, formulario Web/App, teléfono de atención al cliente y sede electrónica.", "Únicamente el burofax postal firmado por notario.", "Mensajes privados en cuentas personales de empleados.", "Llamadas directas a los operarios de campo."], "correct": 0}, {"n": 182, "q": "Según el PGQ-043, para que una queja o sugerencia sea admitida a trámite, el documento debe contener obligatoriamente:", "opts": ["Nombre, apellidos, DNI/NIE/CIF del solicitante, datos de contacto (teléfono/email) y descripción clara de los hechos o motivo.", "El nivel de ingresos anuales del usuario.", "La firma de tres testigos presenciales.", "Un sello oficial de un colegio profesional."], "correct": 0}, {"n": 183, "q": "¿Qué ocurre si una queja o comunicación presentada carece de los datos identificativos mínimos obligatorios según el PGQ-043?", "opts": ["Se archiva directamente sin trámite o se requiere la subsanación al interesado.", "Se envía a la Policía Nacional.", "Se publica en el Boletín Oficial.", "Se le concede una indemnización automática."], "correct": 0}, {"n": 184, "q": "En el proceso de tramitación interna (PGQ-043), una vez registrada la queja en la aplicación informática, esta se deriva inmediatamente a:", "opts": ["El departamento operativo o área responsable del servicio objeto de la incidencia para su investigación y propuesta de respuesta.", "El archivo central directamente.", "Al Ayuntamiento de Madrid.", "Al parque de bomberos."], "correct": 0}, {"n": 185, "q": "¿Quién es el órgano responsable del seguimiento general, control de plazos y auditoría de la calidad del proceso PGQ-043 en EMAYA?", "opts": ["El Departamento de Calidad y Atención al Cliente / Calidad de Servicio.", "El sindicato mayoritario.", "La empresa suministradora de papel.", "El Gabinete de Prensa exclusivamente."], "correct": 0}, {"n": 186, "q": "Según el PGQ-043, cuando una queja pone de manifiesto un fallo recurrente o sistemático en la prestación del servicio, se debe iniciar:", "opts": ["Una Acción Correctora o de Mejora para eliminar la causa raíz del problema.", "Un expediente sancionador contra el usuario que se queja.", "El cierre inmediato del departamento afectado.", "La modificación de la Ley Reguladora de las Bases del Régimen Local."], "correct": 0}, {"n": 187, "q": "¿En qué formato se debe enviar la respuesta final al ciudadano que presentó una queja por vía telemática/email según el PGQ-043?", "opts": ["De forma clara, motivada y respetuosa, a través del mismo canal de entrada o el indicado preferentemente por el usuario.", "Mediante un mensaje en clave que requiera descifrado.", "Publicando una nota anónima en la prensa.", "Exclusivamente por carta certificada previa comparecencia."], "correct": 0}, {"n": 188, "q": "¿Qué diferencia existe en el PGQ-043 entre una 'Queja' y una 'Reclamación Patrimonial / Económica'?", "opts": ["La reclamación exige la exigencia de una indemnización económica por daños y perjuicios y sigue un procedimiento administrativo formal regulado por ley.", "No existe diferencia, son exactamente el mismo concepto.", "La queja es siempre penal y la reclamación civil.", "Las reclamaciones las tramita el Ministerio de Consumo."], "correct": 0}, {"n": 189, "q": "A tenor del PGQ-043, los indicadores periódicos de calidad miden fundamentalmente:", "opts": ["El porcentaje de quejas respondidas dentro del plazo oficial de 15 días y el grado de satisfacción de la resolución.", "El número de folios gastados en imprimir quejas.", "El tiempo que los empleados tardan en almorzar.", "La cantidad de llamadas rechazadas voluntariamente."], "correct": 0}, {"n": 190, "q": "Cuando un ciudadano presenta una sugerencia que es aceptada e implantada por EMAYA, el procedimiento PGQ-043 contempla:", "opts": ["Agradecer formalmente al usuario su contribución a la mejora del servicio público prestado.", "Cobrarle una tasa por registro de patente.", "Exigirle que trabaje gratis en la empresa.", "Ocultar el nombre del autor de la sugerencia."], "correct": 0}, {"n": 191, "q": "Según el PGQ-043, los avisos urgentes por fugas de agua con riesgo de inundación o vertidos peligrosos reciben una tramitación:", "opts": ["Sujeta al plazo ordinario de 15 días hábiles.", "Inmediata y prioritaria por los servicios operacionales de guardia las 24 horas.", "Diferida a la semana siguiente.", "Exclusivamente judicial."], "correct": 1}, {"n": 192, "q": "¿Qué función cumple la aplicación informática corporativa en la gestión del PGQ-043?", "opts": ["Permitir la trazabilidad, asignación, registro de estado, control de plazos y archivo consolidado de cada expediente de entrada.", "Generar facturas de agua automáticas.", "Enviar correo publicitario masivo.", "Eliminar los datos a las 24 horas de la entrada."], "correct": 0}, {"n": 193, "q": "A tenor del PGQ-043, las quejas recibidas en las Oficinas de Atención a la Ciudadanía (OAC) deben ser:", "opts": ["Registradas de forma oficial e introducidas en el sistema informático en el mismo día o plazo máximo fijado.", "Guardadas en un cajón hasta fin de mes.", "Devueltas al ciudadano para que las envíe por correo ordinario.", "Destruidas si superan dos páginas de extensión."], "correct": 0}, {"n": 194, "q": "Según el PGQ-043, ¿qué información debe facilitarse al usuario en el momento de la entrega de su queja o solicitud?", "opts": ["Un justificante de registro con el número de expediente asignado para poder consultar el estado de tramitación.", "El número de teléfono personal del Director General.", "Una copia de las nóminas de la plantilla.", "Un boleto para un sorteo anual."], "correct": 0}, {"n": 195, "q": "¿Qué tratamiento reciben las quejas dirigidas a personal de empresas contratistas que prestan servicios para EMAYA según el PGQ-043?", "opts": ["Se derivan a la empresa contratista exigiendo informe de actuación y aplicación de las medidas contractuales oportunas.", "Se desestiman por no ser personal propio.", "Se ocultan al contratista.", "Se envían a la Inspección de Sanidad."], "correct": 0}, {"n": 196, "q": "A tenor del PGQ-043, los informes estadísticos de análisis de quejas y sugerencias se presentan periódicamente a:", "opts": ["La Dirección General y el Comité de Dirección de EMAYA para la toma de decisiones estratégicas.", "Las agencias de viajes de Palma.", "Los medios de comunicación extranjeros.", "Los clubes deportivos locales."], "correct": 0}, {"n": 197, "q": "Según el PGQ-043, el principio de 'lenguaje claro y accesible' en las respuestas dirigidas a la ciudadanía exige:", "opts": ["Evitar modismos jurídicos innecesarios o excesiva jerga técnica, redactando de forma comprensible, directa y cordial.", "Utilizar un vocabulario exclusivamente en latín.", "Escribir únicamente en mayúsculas.", "Utilizar frases de más de 200 palabras sin comas."], "correct": 0}, {"n": 198, "q": "De acuerdo con el PGQ-043, el archivo y custodia de los expedientes de quejas y sugerencias resueltos se realiza cumpliendo estrictamente:", "opts": ["La Ley Orgánica de Protección de Datos y Garantía de Derechos Digitales (LOPDGDD/RGPD) y el cuadro de clasificación documental.", "Las instrucciones del periódico local.", "Sin custodia alguna, tirándolos en contenedores.", "En los domicilios particulares de los instructores."], "correct": 0}, {"n": 199, "q": "En el PGQ-043, ¿qué ocurre si la resolución de una queja requiere la realización de actuaciones técnicas complejas que superen los 15 días hábiles?", "opts": ["Se notifica una respuesta intermedia al usuario informándole del estado de las actuaciones y del plazo estimado de finalización.", "Se da por archivada silenciosamente.", "Se sanciona al usuario.", "Se cancela la actuación técnica."], "correct": 0}, {"n": 200, "q": "El objetivo final de la aplicación sistemática del procedimiento PGQ-043 en la organización es:", "opts": ["Fomentar la mejora continua de la calidad de los servicios públicos urbanos y la satisfacción del usuario.", "Aumentar el volumen de expedientes archivados.", "Reducir las horas de atención al público.", "Evitar la utilización de medios informáticos."], "correct": 0}], total=30; let questions=[], answers=[], pos=0;
const $=id=>document.getElementById(id);
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function makeTest(){questions=shuffle(bank).slice(0,total).map(x=>{let choices=x.opts.map((text,i)=>({text,correct:i===x.correct}));choices=shuffle(choices);return {...x,choices}});answers=Array(total).fill(null);pos=0;$('test').classList.remove('hidden');$('result').classList.add('hidden');render()}
function render(){let q=questions[pos];$('counter').textContent=`Pregunta ${pos+1} de ${total}`;$('answered').textContent=`Respondidas: ${answers.filter(x=>x!==null).length}/${total}`;$('bar').style.width=((pos+1)/total*100)+'%';$('question').textContent=q.q;$('answers').innerHTML=q.choices.map((c,i)=>`<label><input type="radio" name="answer" value="${i}" ${answers[pos]===i?'checked':''}>${String.fromCharCode(65+i)}. ${c.text}</label>`).join('');document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{answers[pos]=+el.value;$('answered').textContent=`Respondidas: ${answers.filter(x=>x!==null).length}/${total}`});$('prev').disabled=pos===0;$('next').textContent=pos===total-1?'Finalizar':'Siguiente'}
$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<total-1){pos++;render()}else finish()};
function finish(){let correct=0,wrong=0,blank=0;questions.forEach((q,i)=>{if(answers[i]===null)blank++;else if(q.choices[answers[i]].correct)correct++;else wrong++});let raw=correct-wrong*.3, final=Math.max(0,raw);$('test').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${final.toFixed(2)} puntos`;$('details').textContent=`Aciertos: ${correct} · Errores: ${wrong} · En blanco: ${blank} · Máximo: 30`;$('review').innerHTML='<h3>Revisión</h3><ol>'+questions.map((q,i)=>{let a=answers[i], right=q.choices.findIndex(c=>c.correct), cls=a===right?'ok':a===null?'':'bad';return `<li class="${cls}"><strong>${q.q}</strong><br>Correcta: ${String.fromCharCode(65+right)}. ${q.choices[right].text}${a!==null&&a!==right?`<br>Tu respuesta: ${String.fromCharCode(65+a)}. ${q.choices[a].text}`:''}</li>`}).join('')+'</ol>'}
$('restart').onclick=makeTest;makeTest();
</script></body></html>
